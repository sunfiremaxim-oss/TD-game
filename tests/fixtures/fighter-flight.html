<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка полёта истребителей</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050b16;color:#b8d9e8;font:16px system-ui}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px}button,select{font:inherit;padding:8px 12px;background:#142b3b;color:#b8e7ec;border:1px solid #456576;border-radius:5px}canvas{display:block;width:100%;height:calc(100dvh - 120px)}output{display:block;padding:10px;font-size:14px}small{color:#82a0b3}
</style>
<header><strong>Истребитель: манёвры и танк</strong><select id="scene"><option value="seek">Дальний поиск танка</option><option value="convoy" selected>Танк и Истребитель</option><option value="spiral">Две спирали</option><option value="ally">Облёт союзника с тыла</option><option value="moving">Движущийся союзник</option><option value="swarm">Плотная группа</option></select><button id="reset">Заново</button><button id="pause">Пауза</button><button id="paths">Полные траектории</button><button id="show-seek">Поиск</button><button id="show-escort">Сопровождение</button><button id="show-rush">Прорыв</button></header>
<canvas id="preview"></canvas><output id="status"></output>
<script type="module">
import { World } from '../../src/core/World.js';
import { MovementSystem } from '../../src/systems/MovementSystem.js';
import { PhysicsSeparationSystem } from '../../src/systems/PhysicsSeparationSystem.js';
import { RenderSystem } from '../../src/systems/RenderSystem.js';
import { TransformComponent } from '../../src/components/TransformComponent.js';
import { VelocityComponent } from '../../src/components/VelocityComponent.js';
import { CircleColliderComponent } from '../../src/components/CircleColliderComponent.js';
import { HealthComponent } from '../../src/components/HealthComponent.js';
import { EnemyComponent } from '../../src/components/EnemyComponent.js';
import { FighterFlightComponent } from '../../src/components/FighterFlightComponent.js';
import { TowerComponent } from '../../src/components/TowerComponent.js';
import { RenderComponent } from '../../src/components/RenderComponent.js';
import { AttackComponent } from '../../src/components/AttackComponent.js';
import { GameConfig } from '../../src/config/GameConfig.js';
const canvas=document.querySelector('#preview'),scene=document.querySelector('#scene'),status=document.querySelector('#status');
const renderer=new RenderSystem(canvas,null),movement=new MovementSystem(),physics=new PhysicsSeparationSystem();
const paths=new Map();let world,paused=false,elapsed=0,minimum=Infinity,largestPush=0,previous=0;
const cx=450,cy=330;
function add(...components){const id=world.createEntity();for(const c of components)world.addComponent(id,c);return id}
function enemy(type,x,y,speed,direction=1,pitch=3.0){const cfg=GameConfig.enemies[type];
 const e=new EnemyComponent(type);e.rotationSpeed=0;
 const id=add(e,new TransformComponent(x,y),new CircleColliderComponent(cfg.radius,cfg.mass),new VelocityComponent(0,0,speed,speed),new HealthComponent(100,100),new RenderComponent('polygon',cfg.sides,cfg.radius,cfg.color,cfg.glowColor,cfg.glowBlur));
 if(type==='fighter'){world.addComponent(id,new FighterFlightComponent(direction,pitch));paths.set(id,[[x,y]])}return id;
}
function reset(){world=new World();world.width=900;world.height=660;paths.clear();elapsed=0;minimum=Infinity;largestPush=0;paused=false;
 add(new TowerComponent(),new TransformComponent(cx,cy),new CircleColliderComponent(26,1000,true),new HealthComponent(300,300),new AttackComponent(25,1.6,['convoy','seek'].includes(scene.value)?260:130),new RenderComponent('tower',8,26,'#00f3ff','#00f3ff',14));
 if(scene.value==='seek'){enemy('tank',cx+280,cy-100,36.4);enemy('fighter',cx+400,cy+150,108.5,1,3.0)}
 else if(scene.value==='convoy'){enemy('tank',cx+350,cy,36.4);enemy('fighter',cx+410,cy,108.5,1,3.0)}
 else if(scene.value==='swarm'){for(let i=0;i<80;i++){let a=i*2.399963,r=150+(i%10)*24;enemy(i%3?'fighter':'tank',cx+Math.cos(a)*r,cy+Math.sin(a)*r,i%3?108.5:36.4,i%2?1:-1,2.6+(i%7)*.12)}}
 else{enemy('fighter',cx+400,cy,108.5,1,3.0);enemy('fighter',cx-400,cy,108.5,-1,2.8);
 if(scene.value!=='spiral'){const moving=scene.value==='moving', x=moving?260:195,y=moving?310:228;enemy('tank',cx+x,cy-y,moving?36.4:0);enemy('tank',cx-x,cy-y,moving?36.4:0)}}
 document.querySelector('#pause').textContent='Пауза';
}
function step(dt){movement.update(world,dt);const fighters=world.getEntitiesWith(FighterFlightComponent),allies=world.getEntitiesWith(EnemyComponent);
 for(const id of fighters){const p=world.getComponent(id,TransformComponent),points=paths.get(id);if(points.length<1200)points.push([p.x,p.y]);
 if(Math.hypot(p.x-cx,p.y-cy)>75)for(const other of allies){if(other===id)continue;const b=world.getComponent(other,TransformComponent),r=world.getComponent(other,CircleColliderComponent).radius;minimum=Math.min(minimum,Math.hypot(p.x-b.x,p.y-b.y)-11-r)}}
 const before=fighters.map(id=>{const p=world.getComponent(id,TransformComponent);return [p.x,p.y]});physics.update(world,dt);
 for(let i=0;i<fighters.length;i++){const p=world.getComponent(fighters[i],TransformComponent);if(Math.hypot(p.x-cx,p.y-cy)>75)largestPush=Math.max(largestPush,Math.hypot(p.x-before[i][0],p.y-before[i][1]))}elapsed+=dt;
}
function draw(){const ratio=Math.min(devicePixelRatio,1.5),w=canvas.clientWidth,h=canvas.clientHeight;
 if(canvas.width!==Math.round(w*ratio)||canvas.height!==Math.round(h*ratio)){canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio)}
 const scale=Math.min(w/900,h/660),ctx=renderer.ctx;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.fillStyle='#050b16';ctx.fillRect(0,0,w,h);ctx.translate((w-900*scale)/2,(h-660*scale)/2);ctx.scale(scale,scale);
 ctx.lineWidth=1.5;let i=0;for(const points of paths.values()){ctx.strokeStyle=i++%2?'#70d9dfbb':'#ff477cbb';ctx.beginPath();points.forEach((p,j)=>j?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke()}
 renderer.corePulseAngle=elapsed*2.5;renderer.radarRotation=elapsed*.6;renderer._drawTowerAndRange(ctx,world);renderer._drawEnemies(ctx,world);
 let mode='';
 if(['convoy','seek'].includes(scene.value)){
   ctx.strokeStyle='#ffcf6577';ctx.lineWidth=1;ctx.setLineDash([5,7]);ctx.beginPath();ctx.arc(cx,cy,(260+26)/2,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
   ctx.font='15px system-ui';ctx.fillStyle='#ffcf65';ctx.fillText('Половина глубины зоны атаки',cx+85,cy-145);
   const id=world.getEntitiesWith(FighterFlightComponent)[0],flight=world.getComponent(id,FighterFlightComponent),p=world.getComponent(id,TransformComponent),v=world.getComponent(id,VelocityComponent);
   mode=({spiral:'Спираль',joining:'Пристраивается',escort:'Прикрывается танком',breakout:'Выходит из укрытия',charge:'Рывок к ядру'})[flight.mode];
   ctx.fillStyle='#f9a3b8';ctx.fillText(mode,p.x-50,p.y-25);
   mode=` · ${mode} · Скорость: ${Math.hypot(v.vx,v.vy).toFixed(1)} px/с`;
   if(scene.value==='seek'){
     const seek=GameConfig.enemies.fighter.escort.seekDistance;
     ctx.strokeStyle='#70d9df66';ctx.setLineDash([4,8]);ctx.beginPath();ctx.arc(p.x,p.y,seek,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
     ctx.fillStyle='#70d9df';ctx.fillText(`Радиус поиска танка: ${seek} px`,cx-190,cy+245);
     const target=world.getComponent(flight.escortTankId,TransformComponent);
     if(target)mode+=` · До выбранного танка: ${Math.hypot(p.x-target.x,p.y-target.y).toFixed(1)} px`;
   }
 }
 else if(scene.value!=='swarm'){ctx.font='15px system-ui';ctx.fillStyle='#9bb8ca';ctx.fillText('Башня — конечная точка',cx-98,cy+75);if(scene.value!=='spiral')ctx.fillText('Обход с дальней от башни стороны',cx+125,cy-160)}
 status.textContent=`Время: ${elapsed.toFixed(1)} с · Зазор между корпусами: ${Number.isFinite(minimum)?minimum.toFixed(1):'—'} px · Макс. физический толчок вне ядра: ${largestPush.toFixed(2)} px${mode}`;
}
document.querySelector('#reset').onclick=reset;scene.onchange=reset;
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Продолжить':'Пауза'};
document.querySelector('#paths').onclick=()=>{reset();for(let i=0;i<960;i++)step(1/60);paused=true;document.querySelector('#pause').textContent='Продолжить';draw()};
function showConvoy(seconds){scene.value='convoy';reset();for(let i=0;i<Math.round(seconds*60);i++)step(1/60);paused=true;document.querySelector('#pause').textContent='Продолжить';draw()}
document.querySelector('#show-escort').onclick=()=>showConvoy(4);
document.querySelector('#show-rush').onclick=()=>showConvoy(6.1);
document.querySelector('#show-seek').onclick=()=>{scene.value='seek';reset();for(let i=0;i<60;i++)step(1/60);paused=true;document.querySelector('#pause').textContent='Продолжить';draw()};
function frame(time){if(previous&&!paused&&elapsed<18)step(Math.min(.05,(time-previous)/1000));previous=time;draw();requestAnimationFrame(frame)}reset();requestAnimationFrame(frame);
</script></html>
