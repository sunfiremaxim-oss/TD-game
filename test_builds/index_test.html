/**
 * RenderSystem.js
 * Renders the Geometric Neon Cyberpunk visual frame to HTML5 Canvas.
 * Strictly read-only: does not modify any component or entity state.
 */

class RenderSystem {
  constructor(canvas, particleSystem) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.particleSystem = particleSystem;
    this.gridOffset = 0;
    this.corePulseAngle = 0;
    this.radarRotation = 0;
  }

  update(world, deltaTime) {
    const ctx = this.ctx;
    const width = this.canvas.width;
    const height = this.canvas.height;

    this.corePulseAngle += deltaTime * 2.5;
    this.radarRotation += deltaTime * 0.6;

    // 1. Clear background
    ctx.fillStyle = GameConfig.colors.background;
    ctx.fillRect(0, 0, width, height);

    // 2. Draw animated cyber grid
    this._drawGrid(ctx, width, height);

    // 3. Draw Tower range ring and tower entity
    this._drawTowerAndRange(ctx, world);

    // 4. Draw enemies and health bars
    this._drawEnemies(ctx, world);

    // 5. Draw projectiles
    this._drawProjectiles(ctx, world);

    // 6. Draw particles and shockwaves
    if (this.particleSystem) {
      this._drawParticles(ctx);
      this._drawShockwaves(ctx);
      this._drawFloatingTexts(ctx);
    }
  }

  _drawGrid(ctx, width, height) {
    const gridSize = GameConfig.canvas.gridSize || 40;
    ctx.save();
    ctx.strokeStyle = GameConfig.canvas.gridColor;
    ctx.lineWidth = 1;
    ctx.beginPath();

    for (let x = 0; x <= width; x += gridSize) {
      ctx.moveTo(x, 0);
      ctx.lineTo(x, height);
    }
    for (let y = 0; y <= height; y += gridSize) {
      ctx.moveTo(0, y);
      ctx.lineTo(width, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  _drawTowerAndRange(ctx, world) {
    const towers = world.getEntitiesWith(TowerComponent, TransformComponent, AttackComponent, RenderComponent);
    if (towers.length === 0) return;

    const towerId = towers[0];
    const trans = world.getComponent(towerId, TransformComponent);
    const attack = world.getComponent(towerId, AttackComponent);
    const render = world.getComponent(towerId, RenderComponent);
    const targetComp = world.getComponent(towerId, TargetComponent);

    ctx.save();

    // 1. Redesigned Visible Cyber Attack Range Field
    this._drawRangeField(ctx, trans.x, trans.y, attack.range);

    // 2. Target lock-on brackets
    if (targetComp && targetComp.targetEntityId) {
      const enemyTrans = world.getComponent(targetComp.targetEntityId, TransformComponent);
      if (enemyTrans) {
        this._drawLockOnReticle(ctx, enemyTrans.x, enemyTrans.y);
      }
    }

    // 3. Tower base (tech octagon)
    ctx.save();
    ctx.translate(trans.x, trans.y);
    ctx.shadowColor = render.glowColor;
    ctx.shadowBlur = render.glowBlur;

    // Outer octagonal armor
    ctx.fillStyle = '#0d1520';
    ctx.strokeStyle = render.color;
    ctx.lineWidth = 3;
    this._drawPolygonPath(ctx, 0, 0, render.radius, 8, Math.PI / 8);
    ctx.fill();
    ctx.stroke();

    // Inner mechanical details
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.4)';
    ctx.lineWidth = 1.5;
    this._drawPolygonPath(ctx, 0, 0, render.radius * 0.7, 8, 0);
    ctx.stroke();

    // 4. Rotating energy core
    const corePulse = 0.85 + Math.sin(this.corePulseAngle) * 0.15;
    ctx.save();
    ctx.rotate(this.corePulseAngle * 0.5);
    ctx.fillStyle = '#00f3ff';
    ctx.shadowColor = '#00f3ff';
    ctx.shadowBlur = 15;
    this._drawPolygonPath(ctx, 0, 0, render.radius * 0.35 * corePulse, 4, 0);
    ctx.fill();
    ctx.restore();

    // 5. Weapon turret barrel pointing towards rotation
    ctx.rotate(trans.rotation);
    ctx.fillStyle = '#102233';
    ctx.strokeStyle = '#00f3ff';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#00f3ff';
    ctx.shadowBlur = 10;

    // Dual railgun barrels
    const barrelLength = render.radius + 14;
    const barrelWidth = 4;
    const barrelGap = 5;

    // Left barrel
    ctx.fillRect(4, -barrelGap - barrelWidth / 2, barrelLength, barrelWidth);
    ctx.strokeRect(4, -barrelGap - barrelWidth / 2, barrelLength, barrelWidth);

    // Right barrel
    ctx.fillRect(4, barrelGap - barrelWidth / 2, barrelLength, barrelWidth);
    ctx.strokeRect(4, barrelGap - barrelWidth / 2, barrelLength, barrelWidth);

    // Muzzle capacitor
    ctx.fillStyle = '#00f3ff';
    ctx.fillRect(barrelLength - 2, -barrelGap - barrelWidth / 2, 4, barrelWidth);
    ctx.fillRect(barrelLength - 2, barrelGap - barrelWidth / 2, 4, barrelWidth);

    ctx.restore();
    ctx.restore();
  }

  _drawRangeField(ctx, cx, cy, range) {
    ctx.save();

    // 1. Cyberpunk radial gradient aura
    const radGrad = ctx.createRadialGradient(cx, cy, range * 0.15, cx, cy, range);
    radGrad.addColorStop(0, 'rgba(0, 243, 255, 0.005)');
    radGrad.addColorStop(0.65, 'rgba(0, 243, 255, 0.03)');
    radGrad.addColorStop(0.9, 'rgba(0, 243, 255, 0.07)');
    radGrad.addColorStop(1, 'rgba(0, 243, 255, 0.16)');

    ctx.fillStyle = radGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, range, 0, Math.PI * 2);
    ctx.fill();

    // 2. Inner concentric distance rings (Radar grid)
    // 50% distance ring
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.14)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.arc(cx, cy, range * 0.5, 0, Math.PI * 2);
    ctx.stroke();

    // 75% distance ring
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.18)';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 10]);
    ctx.beginPath();
    ctx.arc(cx, cy, range * 0.75, 0, Math.PI * 2);
    ctx.stroke();

    // 3. Animated outer perimeter (tech dashes)
    ctx.strokeStyle = '#00f3ff';
    ctx.shadowColor = '#00f3ff';
    ctx.shadowBlur = 14;
    ctx.lineWidth = 2.5;
    ctx.setLineDash([16, 12, 6, 12]);
    ctx.lineDashOffset = -this.radarRotation * 40;
    ctx.beginPath();
    ctx.arc(cx, cy, range, 0, Math.PI * 2);
    ctx.stroke();

    // Counter-rotating inner perimeter accent
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.35)';
    ctx.shadowBlur = 6;
    ctx.lineWidth = 1;
    ctx.setLineDash([24, 24]);
    ctx.lineDashOffset = this.radarRotation * 25;
    ctx.beginPath();
    ctx.arc(cx, cy, range - 5, 0, Math.PI * 2);
    ctx.stroke();

    ctx.setLineDash([]);

    // 4. Tactical radar crosshair ticks (8 compass points)
    ctx.strokeStyle = '#00f3ff';
    ctx.shadowColor = '#00f3ff';
    ctx.shadowBlur = 10;
    ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const angle = this.radarRotation * 0.25 + (i * Math.PI) / 4;
      const x1 = cx + (range - 8) * Math.cos(angle);
      const y1 = cy + (range - 8) * Math.sin(angle);
      const x2 = cx + (range + 8) * Math.cos(angle);
      const y2 = cy + (range + 8) * Math.sin(angle);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    // 5. Tactical range readout pill
    const tagAngle = -Math.PI / 2 + 0.38;
    const tagX = cx + (range + 16) * Math.cos(tagAngle);
    const tagY = cy + (range + 16) * Math.sin(tagAngle);

    ctx.font = '900 11px Orbitron, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#00f3ff';
    ctx.shadowColor = '#00f3ff';
    ctx.shadowBlur = 10;
    ctx.fillText(`ZONE: ${Math.round(range)}px`, tagX, tagY);

    ctx.restore();
  }

  _drawLockOnReticle(ctx, x, y) {
    ctx.save();
    ctx.strokeStyle = '#00f3ff';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = '#00f3ff';
    ctx.shadowBlur = 8;

    const r = 24;
    const corner = 6;

    // 4 corner reticle brackets
    // Top-Left
    ctx.beginPath();
    ctx.moveTo(x - r + corner, y - r);
    ctx.lineTo(x - r, y - r);
    ctx.lineTo(x - r, y - r + corner);
    ctx.stroke();

    // Top-Right
    ctx.beginPath();
    ctx.moveTo(x + r - corner, y - r);
    ctx.lineTo(x + r, y - r);
    ctx.lineTo(x + r, y - r + corner);
    ctx.stroke();

    // Bottom-Left
    ctx.beginPath();
    ctx.moveTo(x - r + corner, y + r);
    ctx.lineTo(x - r, y + r);
    ctx.lineTo(x - r, y + r - corner);
    ctx.stroke();

    // Bottom-Right
    ctx.beginPath();
    ctx.moveTo(x + r - corner, y + r);
    ctx.lineTo(x + r, y + r);
    ctx.lineTo(x + r, y + r - corner);
    ctx.stroke();

    ctx.restore();
  }

  _drawEnemies(ctx, world) {
    const enemies = world.getEntitiesWith(EnemyComponent, TransformComponent, RenderComponent, HealthComponent);

    for (const id of enemies) {
      const trans = world.getComponent(id, TransformComponent);
      const render = world.getComponent(id, RenderComponent);
      const health = world.getComponent(id, HealthComponent);
      const enemy = world.getComponent(id, EnemyComponent);

      ctx.save();
      ctx.translate(trans.x, trans.y);
      ctx.rotate(trans.rotation);

      ctx.shadowColor = render.glowColor;
      ctx.shadowBlur = render.glowBlur;
      ctx.fillStyle = '#0a0d14';
      ctx.strokeStyle = render.color;
      ctx.lineWidth = 2.5;

      if (enemy.type === 'fighter') {
        // Fighter: aerodynamic dart shape
        this._drawDartPath(ctx, render.radius);
      } else {
        // Scout (3-sided), Tank (6-sided), Sniper (4-sided diamond)
        this._drawPolygonPath(ctx, 0, 0, render.radius, render.sides, 0);
      }
      ctx.fill();
      ctx.stroke();

      // Inner geometric accent
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 1;
      if (enemy.type === 'tank') {
        this._drawPolygonPath(ctx, 0, 0, render.radius * 0.55, 6, Math.PI / 6);
        ctx.stroke();
      } else if (enemy.type === 'sniper') {
        // Sniper charging optic core
        ctx.fillStyle = render.color;
        ctx.beginPath();
        ctx.arc(0, 0, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();

      // Health bar above enemy (if damaged)
      if (health.current < health.max) {
        this._drawHealthBar(ctx, trans.x, trans.y - render.radius - 8, render.radius * 2, health.current, health.max);
      }
    }
  }

  _drawDartPath(ctx, radius) {
    ctx.beginPath();
    ctx.moveTo(radius * 1.3, 0); // Pointy tip forward
    ctx.lineTo(-radius, radius * 0.9); // Wing tip right
    ctx.lineTo(-radius * 0.5, 0); // Inner notch
    ctx.lineTo(-radius, -radius * 0.9); // Wing tip left
    ctx.closePath();
  }

  _drawHealthBar(ctx, x, y, width, current, max) {
    const barWidth = Math.max(28, width);
    const height = 5;
    const halfW = barWidth / 2;
    const pct = Math.max(0, Math.min(1, current / max));

    ctx.save();
    // High-contrast background with dark stroke
    ctx.fillStyle = 'rgba(5, 8, 14, 0.9)';
    ctx.fillRect(x - halfW - 1, y - 1, barWidth + 2, height + 2);

    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1;
    ctx.strokeRect(x - halfW - 1, y - 1, barWidth + 2, height + 2);

    // Glowing neon fill
    ctx.fillStyle = pct > 0.4 ? '#00ff66' : '#ff0055';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 6;
    ctx.fillRect(x - halfW, y, barWidth * pct, height);
    ctx.restore();
  }

  _drawProjectiles(ctx, world) {
    const projectiles = world.getEntitiesWith(ProjectileComponent, TransformComponent, RenderComponent);

    for (const id of projectiles) {
      const trans = world.getComponent(id, TransformComponent);
      const render = world.getComponent(id, RenderComponent);
      const proj = world.getComponent(id, ProjectileComponent);

      ctx.save();
      ctx.translate(trans.x, trans.y);
      ctx.rotate(trans.rotation);

      ctx.shadowColor = render.glowColor;
      ctx.shadowBlur = render.glowBlur;
      ctx.fillStyle = render.color;

      if (!proj.isEnemy) {
        // Player neon bolt
        const length = proj.isCrit ? 16 : 12;
        const width = proj.isCrit ? 5 : 3.5;
        ctx.fillRect(-length / 2, -width / 2, length, width);
      } else {
        // Sniper beam sphere
        ctx.beginPath();
        ctx.arc(0, 0, render.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }
  }

  _drawParticles(ctx) {
    const particles = this.particleSystem.getParticles();
    for (const p of particles) {
      const alpha = Math.max(0, Math.min(1, p.life / p.maxLife));
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    }
  }

  _drawShockwaves(ctx) {
    const shockwaves = this.particleSystem.getShockwaves();
    for (const sw of shockwaves) {
      const alpha = Math.max(0, Math.min(1, sw.life / sw.maxLife));
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = sw.color;
      ctx.lineWidth = sw.lineWidth;
      ctx.shadowColor = sw.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  _drawFloatingTexts(ctx) {
    const texts = this.particleSystem.getFloatingTexts();
    for (const ft of texts) {
      const alpha = Math.max(0, Math.min(1, ft.life / ft.maxLife));
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = `900 ${ft.fontSize}px 'Rajdhani', 'Orbitron', 'Segoe UI', monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // 1. High-contrast dark outline so text pops on any background
      ctx.lineWidth = ft.isCrit ? 4 : 3;
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.95)';
      ctx.shadowBlur = 0; // clear shadow for crisp border
      ctx.strokeText(ft.text, ft.x, ft.y);

      // 2. Bright glowing fill
      ctx.fillStyle = ft.color;
      ctx.shadowColor = ft.color;
      ctx.shadowBlur = ft.isCrit ? 16 : 8;
      ctx.fillText(ft.text, ft.x, ft.y);

      ctx.restore();
    }
  }

  _drawPolygonPath(ctx, cx, cy, radius, sides, startAngle = 0) {
    ctx.beginPath();
    for (let i = 0; i < sides; i++) {
      const a = startAngle + (i * 2 * Math.PI) / sides;
      const x = cx + radius * Math.cos(a);
      const y = cy + radius * Math.sin(a);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }
}

/**
 * UpgradeManager.js
 * Handles upgrade calculations, exponential cost scaling, and mutation
 * of component parameters upon purchase.
 */

class UpgradeManager {
  constructor() {
    this.levels = new Map();
    // Initialize all 12 upgrades to level 0
    for (const key of Object.keys(GameConfig.upgrades)) {
      this.levels.set(key, 0);
    }
  }

  getLevel(upgradeId) {
    return this.levels.get(upgradeId) || 0;
  }

  getCost(upgradeId) {
    const def = GameConfig.upgrades[upgradeId];
    if (!def) return Infinity;
    const lvl = this.getLevel(upgradeId);
    if (def.maxLevel && lvl >= def.maxLevel) return Infinity;
    return Math.round(def.baseCost * Math.pow(def.costMultiplier, lvl));
  }

  canAfford(upgradeId, credits) {
    const cost = this.getCost(upgradeId);
    return credits >= cost && isFinite(cost);
  }

  getCurrentValue(upgradeId) {
    const lvl = this.getLevel(upgradeId);
    const def = GameConfig.upgrades[upgradeId];
    if (!def) return 0;

    switch (upgradeId) {
      case 'damage':
        return GameConfig.tower.baseDamage + lvl * def.valuePerLevel;
      case 'attackSpeed':
        return GameConfig.tower.baseAttackSpeed + lvl * def.valuePerLevel;
      case 'critChance':
        return GameConfig.tower.baseCritChance + lvl * def.valuePerLevel;
      case 'critDamage':
        return GameConfig.tower.baseCritMultiplier + lvl * def.valuePerLevel;
      case 'multishotChance':
        return GameConfig.tower.baseMultishotChance + lvl * def.valuePerLevel;
      case 'multishotTargets':
        return GameConfig.tower.baseMultishotCount + lvl * def.valuePerLevel;
      case 'range': {
        const effectiveLvl = def.maxLevel ? Math.min(lvl, def.maxLevel) : lvl;
        return GameConfig.tower.baseRange + effectiveLvl * def.valuePerLevel;
      }
      case 'distanceDamage':
        return (GameConfig.tower.baseDistanceDamageCoeff || 0.001) + lvl * def.valuePerLevel;
      case 'maxHealth':
        return GameConfig.tower.baseHealth + lvl * def.valuePerLevel;
      case 'armorPercent':
        return Math.min(0.85, GameConfig.tower.basePercentArmor + lvl * def.valuePerLevel);
      case 'flatArmor':
        return GameConfig.tower.baseFlatArmor + lvl * def.valuePerLevel;
      case 'healthRegen':
        return GameConfig.tower.baseRegen + lvl * def.valuePerLevel;
      case 'killCashBonus':
        return 1.0 + lvl * def.valuePerLevel;
      case 'waveCashBonus':
        return 1.0 + lvl * def.valuePerLevel;
      default:
        return 0;
    }
  }

  getNextValue(upgradeId) {
    const lvl = this.getLevel(upgradeId) + 1;
    const def = GameConfig.upgrades[upgradeId];
    if (!def) return 0;

    switch (upgradeId) {
      case 'damage':
        return GameConfig.tower.baseDamage + lvl * def.valuePerLevel;
      case 'attackSpeed':
        return GameConfig.tower.baseAttackSpeed + lvl * def.valuePerLevel;
      case 'critChance':
        return GameConfig.tower.baseCritChance + lvl * def.valuePerLevel;
      case 'critDamage':
        return GameConfig.tower.baseCritMultiplier + lvl * def.valuePerLevel;
      case 'multishotChance':
        return GameConfig.tower.baseMultishotChance + lvl * def.valuePerLevel;
      case 'multishotTargets':
        return GameConfig.tower.baseMultishotCount + lvl * def.valuePerLevel;
      case 'range': {
        const effectiveLvl = def.maxLevel ? Math.min(lvl, def.maxLevel) : lvl;
        return GameConfig.tower.baseRange + effectiveLvl * def.valuePerLevel;
      }
      case 'distanceDamage':
        return (GameConfig.tower.baseDistanceDamageCoeff || 0.001) + lvl * def.valuePerLevel;
      case 'maxHealth':
        return GameConfig.tower.baseHealth + lvl * def.valuePerLevel;
      case 'armorPercent':
        return Math.min(0.85, GameConfig.tower.basePercentArmor + lvl * def.valuePerLevel);
      case 'flatArmor':
        return GameConfig.tower.baseFlatArmor + lvl * def.valuePerLevel;
      case 'healthRegen':
        return GameConfig.tower.baseRegen + lvl * def.valuePerLevel;
      case 'killCashBonus':
        return 1.0 + lvl * def.valuePerLevel;
      case 'waveCashBonus':
        return 1.0 + lvl * def.valuePerLevel;
      default:
        return 0;
    }
  }

  buyUpgrade(upgradeId, world) {
    const cost = this.getCost(upgradeId);
    if (!isFinite(cost)) return false;

    // Check credits on tower economy
    const towers = world.getEntitiesWith(TowerComponent, EconomyComponent);
    if (towers.length === 0) return false;

    const towerId = towers[0];
    const economy = world.getComponent(towerId, EconomyComponent);

    if (economy.credits < cost) return false;

    // Increment level
    const currentLvl = this.getLevel(upgradeId);
    this.levels.set(upgradeId, currentLvl + 1);

    // Apply stats to component
    this._applyToTower(upgradeId, world, towerId);

    // Notify event bus
    world.eventBus.emit('UPGRADE_PURCHASED', {
      upgradeId,
      cost,
      newLevel: currentLvl + 1
    });

    return true;
  }

  _applyToTower(upgradeId, world, towerId) {
    const attack = world.getComponent(towerId, AttackComponent);
    const health = world.getComponent(towerId, HealthComponent);
    const armor = world.getComponent(towerId, ArmorComponent);
    const economy = world.getComponent(towerId, EconomyComponent);

    const newVal = this.getCurrentValue(upgradeId);

    switch (upgradeId) {
      case 'damage':
        if (attack) attack.damage = newVal;
        break;
      case 'attackSpeed':
        if (attack) attack.attackSpeed = newVal;
        break;
      case 'critChance':
        if (attack) attack.critChance = newVal;
        break;
      case 'critDamage':
        if (attack) attack.critMultiplier = newVal;
        break;
      case 'multishotChance':
        if (attack) attack.multishotChance = newVal;
        break;
      case 'multishotTargets':
        if (attack) attack.multishotCount = newVal;
        break;
      case 'range':
        if (attack) {
          const maxScreenRange = (world && world.height) ? Math.floor((world.height / 2) - 20) : 290;
          attack.range = Math.min(newVal, Math.max(GameConfig.tower.baseRange, maxScreenRange));
        }
        break;
      case 'distanceDamage':
        if (attack) attack.distanceBonus = newVal;
        break;
      case 'maxHealth':
        if (health) {
          const diff = newVal - health.max;
          health.max = newVal;
          health.current = Math.min(health.max, health.current + diff);
        }
        break;
      case 'armorPercent':
        if (armor) armor.percentReduction = newVal;
        break;
      case 'flatArmor':
        if (armor) armor.flatReduction = newVal;
        break;
      case 'healthRegen':
        if (health) health.regenRate = newVal;
        break;
      case 'killCashBonus':
        if (economy) economy.killMultiplier = newVal;
        break;
      case 'waveCashBonus':
        if (economy) economy.waveMultiplier = newVal;
        break;
    }
  }

  getAllUpgrades() {
    return Object.values(GameConfig.upgrades).map(def => ({
      ...def,
      level: this.getLevel(def.id),
      cost: this.getCost(def.id),
      currentVal: this.getCurrentValue(def.id),
      nextVal: this.getNextValue(def.id)
    }));
  }
}

/**
 * UIManager.js
 * Strictly isolated DOM UI manager.
 * Handles HUD panels, upgrade tabs, target strategy selectors, game speed, and modals.
 */

class UIManager {
  constructor(world, upgradeManager, audioSystem) {
    this.world = world;
    this.upgradeManager = upgradeManager;
    this.audioSystem = audioSystem;

    this.activeTab = 'offense'; // 'offense' | 'defense' | 'utility'

    // DOM references
    this.dom = {
      waveText: document.getElementById('hud-wave'),
      enemyText: document.getElementById('hud-enemies'),
      creditsText: document.getElementById('hud-credits'),
      hpBarFill: document.getElementById('hud-hp-fill'),
      hpText: document.getElementById('hud-hp-text'),
      
      // Intermission countdown bar
      intermissionContainer: document.getElementById('intermission-container'),
      intermissionBar: document.getElementById('intermission-bar'),
      intermissionText: document.getElementById('intermission-text'),

      // Controls
      speedBtn: document.getElementById('btn-speed'),
      audioBtn: document.getElementById('btn-audio'),

      // Strategy buttons
      stratClosest: document.getElementById('strat-closest'),
      stratStrongest: document.getElementById('strat-strongest'),
      stratWeakest: document.getElementById('strat-weakest'),

      // Upgrade tabs and list
      tabOffense: document.getElementById('tab-offense'),
      tabDefense: document.getElementById('tab-defense'),
      tabUtility: document.getElementById('tab-utility'),
      upgradesList: document.getElementById('upgrades-list'),

      // Game over modal
      modalGameOver: document.getElementById('modal-gameover'),
      finalWaveText: document.getElementById('modal-final-wave'),
      btnRestart: document.getElementById('btn-restart')
    };

    this.enemiesAlive = 0;
    this.totalEnemies = 0;
    this._wasRegenerating = false;
    this._lastDisplayHp = null;
    this._lastMaxHp = null;
    this._lastRegenRate = null;
  }

  init() {
    this._bindEvents();
    this._subscribeWorldEvents();
    this.renderUpgrades();
    this.updateHUD();
  }

  _bindEvents() {
    // 1. Tabs
    this.dom.tabOffense?.addEventListener('click', () => this.switchTab('offense'));
    this.dom.tabDefense?.addEventListener('click', () => this.switchTab('defense'));
    this.dom.tabUtility?.addEventListener('click', () => this.switchTab('utility'));

    // 2. Speed toggle (1x / 2x)
    this.dom.speedBtn?.addEventListener('click', () => {
      this.world.gameSpeed = this.world.gameSpeed === 1.0 ? 2.0 : 1.0;
      if (this.dom.speedBtn) {
        this.dom.speedBtn.textContent = `${this.world.gameSpeed}x`;
        this.dom.speedBtn.classList.toggle('active', this.world.gameSpeed === 2.0);
      }
    });

    // 3. Audio mute toggle
    this.dom.audioBtn?.addEventListener('click', () => {
      const isMuted = this.audioSystem.toggleMute();
      if (this.dom.audioBtn) {
        this.dom.audioBtn.textContent = isMuted ? '🔇' : '🔊';
        this.dom.audioBtn.classList.toggle('muted', isMuted);
      }
    });

    // 4. Target strategy switcher
    const setStrategy = (strat) => {
      const towers = this.world.getEntitiesWith(TowerComponent, TargetComponent);
      if (towers.length > 0) {
        const targetComp = this.world.getComponent(towers[0], TargetComponent);
        if (targetComp) targetComp.strategy = strat;
      }
      this.dom.stratClosest?.classList.toggle('active', strat === 'closest');
      this.dom.stratStrongest?.classList.toggle('active', strat === 'strongest');
      this.dom.stratWeakest?.classList.toggle('active', strat === 'weakest');
    };

    this.dom.stratClosest?.addEventListener('click', () => setStrategy('closest'));
    this.dom.stratStrongest?.addEventListener('click', () => setStrategy('strongest'));
    this.dom.stratWeakest?.addEventListener('click', () => setStrategy('weakest'));

    // 5. Restart button
    this.dom.btnRestart?.addEventListener('click', () => {
      this.world.eventBus.emit('RESTART_GAME');
    });
  }

  _subscribeWorldEvents() {
    // Intermission ticks
    this.world.eventBus.on('INTERMISSION_TICK', (data) => {
      if (this.dom.intermissionContainer) {
        this.dom.intermissionContainer.classList.remove('hidden');
      }
      if (this.dom.intermissionBar) {
        this.dom.intermissionBar.style.width = `${(data.progress * 100).toFixed(1)}%`;
      }
      if (this.dom.intermissionText) {
        this.dom.intermissionText.textContent = `ПЕРЕРЫВ: ${data.remaining.toFixed(1)}s (ВОЛНА ${data.nextWave})`;
      }
    });

    this.world.eventBus.on('WAVE_STARTED', (data) => {
      if (this.dom.intermissionContainer) {
        this.dom.intermissionContainer.classList.add('hidden');
      }
      if (this.dom.waveText) {
        this.dom.waveText.textContent = `ВОЛНА ${String(data.wave).padStart(2, '0')}`;
      }
      this.totalEnemies = data.totalEnemies;
      this.enemiesAlive = data.totalEnemies;
      this._updateEnemiesCount();
    });

    this.world.eventBus.on('WAVE_PROGRESS', (data) => {
      this.enemiesAlive = (data.total - data.spawned) + data.alive;
      this._updateEnemiesCount();
    });

    this.world.eventBus.on('ENTITY_DIED', (data) => {
      if (data.isEnemy) {
        this.enemiesAlive = Math.max(0, this.enemiesAlive - 1);
        this._updateEnemiesCount();
      }
    });

    this.world.eventBus.on('CREDITS_CHANGED', (data) => {
      if (this.dom.creditsText) {
        this.dom.creditsText.textContent = `${data.credits.toLocaleString()} ◈`;
        this.dom.creditsText.classList.remove('pulse');
        void this.dom.creditsText.offsetWidth; // trigger reflow
        this.dom.creditsText.classList.add('pulse');
      }
      this.renderUpgrades();
    });

    this.world.eventBus.on('UPGRADE_PURCHASED', () => {
      this.renderUpgrades();
      this.updateHUD();
    });

    this.world.eventBus.on('TOWER_DAMAGED', () => {
      this.updateHUD();
    });

    this.world.eventBus.on('GAME_OVER', () => {
      if (this.dom.modalGameOver) {
        this.dom.modalGameOver.classList.remove('hidden');
      }
      if (this.dom.finalWaveText && this.dom.waveText) {
        this.dom.finalWaveText.textContent = this.dom.waveText.textContent;
      }
    });
  }

  _updateEnemiesCount() {
    if (this.dom.enemyText) {
      this.dom.enemyText.textContent = `ВРАГИ: ${this.enemiesAlive}`;
    }
  }

  switchTab(tabName) {
    this.activeTab = tabName;
    this.dom.tabOffense?.classList.toggle('active', tabName === 'offense');
    this.dom.tabDefense?.classList.toggle('active', tabName === 'defense');
    this.dom.tabUtility?.classList.toggle('active', tabName === 'utility');
    this.renderUpgrades();
  }

  /**
   * Frame-by-frame UI update for continuous metrics (like passive health regeneration).
   */
  update(deltaTime) {
    const towers = this.world.getEntitiesWith(TowerComponent, HealthComponent);
    if (towers.length === 0) return;

    const health = this.world.getComponent(towers[0], HealthComponent);
    if (!health) return;

    // Continuously sync HUD while health is actively regenerating
    if (health.current > 0 && health.current < health.max && health.regenRate > 0) {
      this._updateHealthHUD(health);
      this._wasRegenerating = true;
    } else if (this._wasRegenerating) {
      // Clamped back to full health: do clean final update
      this._updateHealthHUD(health);
      this._wasRegenerating = false;
    }
  }

  _updateHealthHUD(health) {
    if (!health) return;

    const pct = Math.max(0, Math.min(100, (health.current / health.max) * 100));
    const pctStr = `${pct.toFixed(1)}%`;
    if (this.dom.hpBarFill && this.dom.hpBarFill.style.width !== pctStr) {
      this.dom.hpBarFill.style.width = pctStr;
    }

    const displayCurrent = Math.min(health.max, Math.ceil(health.current));
    if (this.dom.hpText && (this._lastDisplayHp !== displayCurrent || this._lastMaxHp !== health.max || this._lastRegenRate !== health.regenRate)) {
      this._lastDisplayHp = displayCurrent;
      this._lastMaxHp = health.max;
      this._lastRegenRate = health.regenRate;
      const regenText = health.regenRate > 0 ? ` (+${health.regenRate.toFixed(1)}/с)` : '';
      this.dom.hpText.innerHTML = `<span style="color:#94a3b8; font-weight:700;">HP:</span> <strong>${displayCurrent}</strong> / ${health.max}${regenText ? `<span style="color:#00ff88; font-weight:800;">${regenText}</span>` : ''}`;
    }
  }

  updateHUD() {
    const towers = this.world.getEntitiesWith(TowerComponent, HealthComponent, EconomyComponent);
    if (towers.length === 0) return;

    const towerId = towers[0];
    const health = this.world.getComponent(towerId, HealthComponent);
    const economy = this.world.getComponent(towerId, EconomyComponent);

    if (health) {
      this._updateHealthHUD(health);
    }

    if (economy && this.dom.creditsText) {
      this.dom.creditsText.textContent = `${economy.credits.toLocaleString()} ◈`;
    }
  }

  renderUpgrades() {
    if (!this.dom.upgradesList) return;

    const towers = this.world.getEntitiesWith(TowerComponent, EconomyComponent);
    const currentCredits = towers.length > 0 ? this.world.getComponent(towers[0], EconomyComponent).credits : 0;

    const allUpgrades = this.upgradeManager.getAllUpgrades();
    const filtered = allUpgrades.filter(u => u.category === this.activeTab);

    this.dom.upgradesList.innerHTML = '';

    for (const u of filtered) {
      const isMax = u.maxLevel && u.level >= u.maxLevel;
      const canAfford = !isMax && currentCredits >= u.cost;

      const card = document.createElement('div');
      card.className = `upgrade-card ${isMax ? 'maxed' : ''}`;

      const formattedCurrent = u.format(u.currentVal);
      const formattedNext = isMax ? 'MAX' : u.format(u.nextVal);

      card.innerHTML = `
        <div class="upgrade-header">
          <span class="upgrade-title">${u.icon} ${u.name}</span>
          <span class="upgrade-lvl">УР. ${u.level}${u.maxLevel ? `/${u.maxLevel}` : ''}</span>
        </div>
        <div class="upgrade-stats">
          <span class="stat-current">${formattedCurrent}</span>
          <span class="stat-arrow">➔</span>
          <span class="stat-next">${formattedNext}</span>
        </div>
        <button class="upgrade-buy-btn ${!canAfford ? 'disabled' : ''}" ${!canAfford ? 'disabled' : ''}>
          ${isMax ? 'МАКСИМУМ' : `КУПИТЬ: ${u.cost.toLocaleString()} ◈`}
        </button>
      `;

      const buyBtn = card.querySelector('.upgrade-buy-btn');
      if (buyBtn && !isMax) {
        buyBtn.addEventListener('click', () => {
          this.upgradeManager.buyUpgrade(u.id, this.world);
        });
      }

      this.dom.upgradesList.appendChild(card);
    }
  }

  hideGameOver() {
    if (this.dom.modalGameOver) {
      this.dom.modalGameOver.classList.add('hidden');
    }
  }
}

/**
 * main.js
 * Game entry point, ECS bootstrap, and main animation loop.
 */

// Components
// Systems
// Managers & UI
class GameApp {
  constructor() {
    this.canvas = document.getElementById('game-canvas');
    this.world = null;
    this.upgradeManager = null;
    this.uiManager = null;
    this.waveSystem = null;
    this.particleSystem = null;
    this.audioSystem = null;

    this.lastTime = 0;
    this.animationFrameId = null;

    this._init();
  }

  _init() {
    this.audioSystem = new AudioSystem();
    this._resizeCanvas();
    window.addEventListener('resize', () => this._resizeCanvas());
    this._startNewGame();
  }

  _resizeCanvas() {
    const wrapper = document.getElementById('canvas-wrapper');
    if (!wrapper || !this.canvas) return;

    const width = wrapper.clientWidth || GameConfig.canvas.width;
    const height = wrapper.clientHeight || GameConfig.canvas.height;

    this.canvas.width = width;
    this.canvas.height = height;

    if (this.world) {
      this.world.width = width;
      this.world.height = height;

      // Keep tower centered on resize and clamp range to canvas bounds
      const towers = this.world.getEntitiesWith(TowerComponent, TransformComponent);
      if (towers.length > 0) {
        const trans = this.world.getComponent(towers[0], TransformComponent);
        trans.x = width / 2;
        trans.y = height / 2;

        const attack = this.world.getComponent(towers[0], AttackComponent);
        if (attack && this.upgradeManager) {
          const upgradeVal = this.upgradeManager.getCurrentValue('range');
          const maxScreenRange = Math.floor((height / 2) - 20);
          attack.range = Math.min(upgradeVal, Math.max(GameConfig.tower.baseRange, maxScreenRange));
        }
      }
    }
  }

  _startNewGame() {
    if (this.animationFrameId) {
      cancelAnimationFrame(this.animationFrameId);
    }

    // 1. Create World and Managers
    this.world = new World();
    this.world.width = this.canvas.width;
    this.world.height = this.canvas.height;

    this.upgradeManager = new UpgradeManager();
    this.particleSystem = new ParticleSystem();
    this.waveSystem = new WaveSystem();

    // 2. Register Systems in strict architectural pipeline order
    this.world.registerSystem(new MovementSystem());
    this.world.registerSystem(new PhysicsSeparationSystem());
    this.world.registerSystem(new TargetingSystem());
    this.world.registerSystem(new SniperAISystem());
    this.world.registerSystem(new WeaponSystem());
    this.world.registerSystem(new CollisionSystem());
    this.world.registerSystem(new DamageSystem());
    this.world.registerSystem(this.waveSystem);
    this.world.registerSystem(new EconomySystem());
    this.world.registerSystem(this.particleSystem);
    this.world.registerSystem(this.audioSystem);
    this.world.registerSystem(new RenderSystem(this.canvas, this.particleSystem));

    // 3. Create Central Tower Entity
    this._createTowerEntity();

    // 4. Initialize UI Manager
    this.uiManager = new UIManager(this.world, this.upgradeManager, this.audioSystem);
    this.uiManager.init();
    this.uiManager.hideGameOver();

    // 5. Start Wave 1 immediately with UI subscribed
    this.waveSystem.startFirstWave(this.world);

    // 6. Handle game restart events
    this.world.eventBus.on('RESTART_GAME', () => {
      this._startNewGame();
    });

    // 7. Start game loop
    this.lastTime = performance.now();
    this._loop = this._loop.bind(this);
    this.animationFrameId = requestAnimationFrame(this._loop);
  }

  _createTowerEntity() {
    const towerId = this.world.createEntity();
    const centerX = this.world.width / 2;
    const centerY = this.world.height / 2;
    const towerCfg = GameConfig.tower;

    this.world.addComponent(towerId, new TowerComponent());
    this.world.addComponent(towerId, new TransformComponent(centerX, centerY, 0));
    this.world.addComponent(towerId, new CircleColliderComponent(towerCfg.colliderRadius, 1000, true)); // isStatic: true
    this.world.addComponent(towerId, new HealthComponent(towerCfg.baseHealth, towerCfg.baseHealth, towerCfg.baseRegen));
    this.world.addComponent(towerId, new ArmorComponent(towerCfg.basePercentArmor, towerCfg.baseFlatArmor));
    this.world.addComponent(towerId, new AttackComponent(
      towerCfg.baseDamage,
      towerCfg.baseAttackSpeed,
      towerCfg.baseRange,
      0,
      towerCfg.baseCritChance,
      towerCfg.baseCritMultiplier,
      towerCfg.baseMultishotCount,
      towerCfg.baseMultishotChance,
      towerCfg.baseDistanceDamageCoeff || 0.001
    ));
    this.world.addComponent(towerId, new TargetComponent(null, 'closest'));
    this.world.addComponent(towerId, new RenderComponent(
      'tower',
      8,
      towerCfg.radius,
      GameConfig.colors.tower,
      GameConfig.colors.towerGlow,
      14
    ));
    this.world.addComponent(towerId, new EconomyComponent(towerCfg.startCredits, 1.0, 1.0));

    return towerId;
  }

  _loop(timestamp) {
    const rawDelta = (timestamp - this.lastTime) / 1000;
    this.lastTime = timestamp;

    // Clamp delta time to prevent simulation spikes during tab changes
    const deltaTime = Math.min(0.1, rawDelta);

    this.world.update(deltaTime);
    if (this.uiManager) {
      this.uiManager.update(deltaTime);
    }

    this.animationFrameId = requestAnimationFrame(this._loop);
  }
}

// Instantiate safely on DOM ready or immediately if already loaded
if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', () => {
    window.gameApp = new GameApp();
  });
} else {
  window.gameApp = new GameApp();
}


})();
