/**
 * EconomySystem.js
 * Tracks credit income, kill bounties, and wave clear bonuses.
 * Interacts with EconomyComponent and dispatches balance change events.
 */

class EconomySystem {
  init(world) {
    // 1. Enemy kill bounty
    world.eventBus.on('ENTITY_DIED', (event) => {
      if (!event.isEnemy) return;

      const eco = this._getEconomy(world);
      if (!eco) return;

      const baseReward = event.baseReward !== undefined ? event.baseReward : 10;
      if (baseReward <= 0) return;

      const earned = Math.max(1, Math.round(baseReward * (eco.killMultiplier || 1.0)));
      eco.credits += earned;

      world.eventBus.emit('CREDITS_CHANGED', {
        credits: eco.credits,
        earned,
        source: 'kill',
        x: event.x,
        y: event.y
      });
    });

    // 2. Wave completion reward
    world.eventBus.on('WAVE_COMPLETED', (event) => {
      const eco = this._getEconomy(world);
      if (!eco) return;

      const baseBonus = GameConfig.waves.waveBaseReward || 50;
      const growth = GameConfig.waves.waveRewardGrowth || 25;
      const rawBonus = baseBonus + (event.wave || 1) * growth;
      const earned = Math.round(rawBonus * (eco.waveMultiplier || 1.0));

      eco.credits += earned;

      world.eventBus.emit('CREDITS_CHANGED', {
        credits: eco.credits,
        earned,
        source: 'wave'
      });
    });

    // 3. Purchase deduction
    world.eventBus.on('UPGRADE_PURCHASED', (event) => {
      const eco = this._getEconomy(world);
      if (!eco) return;

      eco.credits -= event.cost;

      world.eventBus.emit('CREDITS_CHANGED', {
        credits: eco.credits,
        earned: -event.cost,
        source: 'purchase'
      });
    });
  }

  update(world, deltaTime) {
    // Economy is event-driven; no per-frame polling needed here
  }

  _getEconomy(world) {
    const towers = world.getEntitiesWith(TowerComponent, EconomyComponent);
    if (towers.length > 0) {
      return world.getComponent(towers[0], EconomyComponent);
    }
    return null;
  }
}

/**
 * ParticleSystem.js
 * Manages geometric neon debris, shockwave rings, and floating combat text.
 */

class ParticleSystem {
  constructor() {
    this.particles = [];
    this.shockwaves = [];
    this.floatingTexts = [];
  }

  init(world) {
    // 1. Damage dealt: hit sparks only (no screen-cluttering damage numbers)
    world.eventBus.on('DAMAGE_DEALT', (event) => {
      this._spawnDamageSparks(event.x, event.y, event.isCrit ? '#ffe600' : '#00f3ff', event.isCrit ? 10 : 5);
    });

    // 2. Kill bounty: clean and rewarding floating currency text (+X ◈)
    world.eventBus.on('CREDITS_CHANGED', (event) => {
      if (event.source === 'kill' && event.earned > 0 && event.x !== undefined && event.y !== undefined) {
        this.floatingTexts.push({
          x: event.x + (Math.random() * 10 - 5),
          y: event.y - 12,
          text: `+${event.earned} ◈`,
          color: '#00ff88', // Vibrant cyber-cash neon green (distinct from white/yellow damage)
          fontSize: event.earned >= 30 ? 22 : 18,
          isCrit: event.earned >= 30, // Extra glow for high-value targets like tanks
          vy: 60,
          life: 1.0,
          maxLife: 1.0
        });
      }
    });

    // 2. Entity explosion: bursting shards + expanding shockwave
    world.eventBus.on('ENTITY_DIED', (event) => {
      const colorMap = {
        scout: '#ffe600',
        fighter: '#ff0055',
        tank: '#9d00ff',
        sniper: '#ff7700',
        aegis: '#00e5ff',
        splitter: '#00ff66',
        splitter_shard: '#00ff66',
        blinker: '#ffffff',
        boss_architect: '#ff0055',
        boss_shield: '#00f3ff'
      };
      const color = colorMap[event.enemyType] || '#00f3ff';
      const isBoss = event.enemyType === 'boss_architect';

      // Burst of fragments
      const particleCount = isBoss ? 45 : (event.enemyType === 'tank' || event.enemyType === 'splitter' ? 24 : 14);
      this._spawnExplosion(event.x, event.y, color, particleCount);

      // Expanding neon shockwave
      this.shockwaves.push({
        x: event.x,
        y: event.y,
        radius: 6,
        maxRadius: isBoss ? 90 : (event.enemyType === 'tank' ? 55 : 35),
        color,
        lineWidth: isBoss ? 5 : 3,
        life: isBoss ? 0.75 : 0.45,
        maxLife: isBoss ? 0.75 : 0.45
      });
    });

    // 3. Sniper muzzle flare or shot effect
    world.eventBus.on('ENEMY_SNIPER_SHOT', (event) => {
      this._spawnDamageSparks(event.x, event.y, '#ff7700', 6);
    });
  }

  update(world, deltaTime) {
    // 1. Update particles
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * deltaTime;
      p.y += p.vy * deltaTime;
      p.vx *= 0.94; // friction
      p.vy *= 0.94;
      p.rotation += p.vRot * deltaTime;
      p.life -= deltaTime;

      if (p.life <= 0) {
        this.particles.splice(i, 1);
      }
    }

    // 2. Update shockwaves
    for (let i = this.shockwaves.length - 1; i >= 0; i--) {
      const sw = this.shockwaves[i];
      sw.life -= deltaTime;
      const progress = 1 - (sw.life / sw.maxLife);
      sw.radius = 6 + (sw.maxRadius - 6) * progress;

      if (sw.life <= 0) {
        this.shockwaves.splice(i, 1);
      }
    }

    // 3. Update floating texts
    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      const ft = this.floatingTexts[i];
      ft.y -= ft.vy * deltaTime;
      ft.vy *= 0.96;
      ft.life -= deltaTime;

      if (ft.life <= 0) {
        this.floatingTexts.splice(i, 1);
      }
    }
  }

  _spawnDamageSparks(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 70 + Math.random() * 120;
      this.particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        rotation: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 10,
        size: 2.5 + Math.random() * 2,
        color,
        life: 0.35 + Math.random() * 0.2,
        maxLife: 0.55
      });
    }
  }

  _spawnExplosion(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 100 + Math.random() * 220;
      this.particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        rotation: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 15,
        size: 3 + Math.random() * 4,
        color,
        life: 0.45 + Math.random() * 0.35,
        maxLife: 0.8
      });
    }
  }

  getParticles() {
    return this.particles;
  }

  getShockwaves() {
    return this.shockwaves;
  }

  getFloatingTexts() {
    return this.floatingTexts;
  }
}

/**
 * AudioSystem.js
 * Procedural Web Audio API sound synthesizer driven by EventBus events.
 * Manages dual-channel audio control (SFX and BGM) with volume cycling,
 * mute toggling, and instant autoplay unlocking from the very start of the game loop.
 */

class AudioSystem {
  constructor() {
    this.audioCtx = null;
    this.sfxMasterGain = null;

    // SFX channel state (100% -> 60% -> 30% -> 0% / MUTE -> 100%)
    this.sfxVolume = 1.0;
    this.sfxMuted = false;

    // BGM channel state (100% -> 60% -> 30% -> 0% / MUTE -> 100%)
    this.baseBgmVolume = 0.38; // Balanced background level relative to SFX
    this.bgmVolumeFactor = 1.0;
    this.bgmMuted = false;

    // Background music playlist
    this.tracks = [
      'music/background_music_1.mp3',
      'music/background_music_2.mp3'
    ];
    this.currentTrackIndex = 0;
    this.bgmAudio = null;
    this.isPlayingBGM = false;
    this.isBgmUnlocked = false;

    this._windowListenersAttached = false;
    this._fallbackTried = false;
    this.world = null;
  }

  // =========================================================================
  // BACKGROUND MUSIC (BGM) PIPELINE
  // =========================================================================

  _initBGM() {
    if (this.bgmAudio || typeof Audio === 'undefined') return;

    this.bgmAudio = new Audio();
    this.bgmAudio.preload = 'auto';
    this.bgmAudio.loop = false; // Alternated on 'ended' event
    this._updateBgmVolume();

    // Alternate tracks on track end and loop indefinitely
    this.bgmAudio.addEventListener('ended', () => {
      this.currentTrackIndex = (this.currentTrackIndex + 1) % this.tracks.length;
      this._loadAndPlayTrack();
    });

    // Fallback if relative path requires traversal (e.g. launched from subfolder)
    this.bgmAudio.addEventListener('error', () => {
      if (!this._fallbackTried) {
        this._fallbackTried = true;
        this.tracks = this.tracks.map(t => t.startsWith('../') ? t.slice(3) : '../' + t);
        this._loadAndPlayTrack();
      }
    });

    this._loadTrack(this.currentTrackIndex);
  }

  _loadTrack(index) {
    if (!this.bgmAudio) return;
    this.bgmAudio.src = this.tracks[index];
    this._updateBgmVolume();
  }

  _loadAndPlayTrack() {
    this._loadTrack(this.currentTrackIndex);
    if (!this.bgmMuted && this.isPlayingBGM && this.bgmAudio) {
      this.bgmAudio.play().catch(() => {});
    }
  }

  _updateBgmVolume() {
    if (!this.bgmAudio) return;
    const effectiveVol = this.bgmMuted ? 0 : (this.baseBgmVolume * this.bgmVolumeFactor);
    this.bgmAudio.volume = Math.max(0, Math.min(1, effectiveVol));
    this.bgmAudio.muted = this.bgmMuted || this.bgmVolumeFactor === 0;

    if (!this.bgmMuted && this.bgmVolumeFactor > 0 && this.isPlayingBGM && this.bgmAudio.paused) {
      this.bgmAudio.play().catch(() => {});
    }
  }

  startBGM() {
    this._initBGM();
    this.isPlayingBGM = true;
    if (this.bgmMuted || !this.bgmAudio) return;

    const playPromise = this.bgmAudio.play();
    if (playPromise !== undefined) {
      playPromise
        .then(() => {
          this.isBgmUnlocked = true;
          if (this.world) this.world.eventBus.emit('AUDIO_UNLOCKED');
        })
        .catch(() => {
          // Autoplay policy: start silently on first user hover/move/interaction without any banners
        });
    }
  }

  pauseBGM() {
    this.isPlayingBGM = false;
    if (this.bgmAudio) {
      this.bgmAudio.pause();
    }
  }

  resumeBGM() {
    this.isPlayingBGM = true;
    if (this.bgmMuted || this.bgmVolumeFactor <= 0) return;
    this._initBGM();
    if (this.bgmAudio) {
      this.bgmAudio.play().catch(() => {});
    }
  }

  // =========================================================================
  // VOLUME & MUTE CONTROLS
  // =========================================================================

  // SFX Channel
  cycleSfxVolume() {
    const levels = [1.0, 0.6, 0.3, 0.0];
    const currentIndex = levels.findIndex(lvl => Math.abs(lvl - this.sfxVolume) < 0.05);
    const nextIndex = (currentIndex + 1) % levels.length;
    this.sfxVolume = levels[nextIndex];
    this.sfxMuted = this.sfxVolume === 0;
    this._updateSfxGain();
    this.unlockAudio();
    return this.getSfxLabel();
  }

  toggleSfxMute() {
    this.sfxMuted = !this.sfxMuted;
    if (!this.sfxMuted && this.sfxVolume === 0) {
      this.sfxVolume = 1.0;
    }
    this._updateSfxGain();
    this.unlockAudio();
    return this.getSfxLabel();
  }

  getSfxLabel() {
    if (this.sfxMuted || this.sfxVolume === 0) {
      return { icon: '🔇', text: 'ЗВУК ВЫКЛ', title: 'Звуки игры: ВЫКЛ (Клик: изменить громкость, ПКМ: вкл)', isMuted: true };
    }
    const pct = Math.round(this.sfxVolume * 100);
    const icon = pct > 70 ? '🔊' : (pct > 30 ? '🔉' : '🔈');
    const text = pct === 100 ? 'ЗВУК' : `ЗВУК ${pct}%`;
    return { icon, text, title: `Звуки игры: ${pct}% (Клик: изменить громкость, ПКМ: выкл)`, isMuted: false };
  }

  _updateSfxGain() {
    if (this.sfxMasterGain && this.audioCtx) {
      const effectiveGain = this.sfxMuted ? 0 : this.sfxVolume;
      this.sfxMasterGain.gain.setValueAtTime(effectiveGain, this.audioCtx.currentTime);
    }
  }

  // Music Channel
  cycleBgmVolume() {
    const levels = [1.0, 0.6, 0.3, 0.0];
    const currentIndex = levels.findIndex(lvl => Math.abs(lvl - this.bgmVolumeFactor) < 0.05);
    const nextIndex = (currentIndex + 1) % levels.length;
    this.bgmVolumeFactor = levels[nextIndex];
    this.bgmMuted = this.bgmVolumeFactor === 0;
    this._updateBgmVolume();
    this.unlockAudio();
    return this.getBgmLabel();
  }

  toggleBgmMute() {
    this.bgmMuted = !this.bgmMuted;
    if (!this.bgmMuted && this.bgmVolumeFactor === 0) {
      this.bgmVolumeFactor = 1.0;
    }
    this._updateBgmVolume();
    this.unlockAudio();
    return this.getBgmLabel();
  }

  getBgmLabel() {
    if (this.bgmMuted || this.bgmVolumeFactor === 0) {
      return { icon: '🔇', text: 'МУЗЫКА ВЫКЛ', title: 'Фоновая музыка: ВЫКЛ (Клик: включить, ПКМ: вкл)', isMuted: true };
    }
    const pct = Math.round(this.bgmVolumeFactor * 100);
    const icon = pct > 50 ? '🎵' : '🎶';
    const text = pct === 100 ? 'МУЗЫКА' : `МУЗЫКА ${pct}%`;
    return { icon, text, title: `Фоновая музыка: ${pct}% (Клик: изменить громкость, ПКМ: выкл)`, isMuted: false };
  }

  // Master toggle (backward compatibility)
  toggleMute() {
    const shouldMute = !(this.sfxMuted && this.bgmMuted);
    this.sfxMuted = shouldMute;
    this.bgmMuted = shouldMute;
    this._updateSfxGain();
    this._updateBgmVolume();
    return shouldMute;
  }

  // =========================================================================
  // GLOBAL AUDIO CONTEXT & AUTOPLAY UNLOCK
  // =========================================================================

  _setupGlobalUnlockListeners() {
    if (this._windowListenersAttached || typeof window === 'undefined') return;
    this._windowListenersAttached = true;

    this._unlockHandler = () => {
      this.unlockAudio();
    };

    this._unlockEvents = ['pointerdown', 'mousedown', 'keydown', 'touchstart', 'click', 'focus', 'mousemove', 'pointermove', 'wheel'];
    this._unlockEvents.forEach(evt => {
      window.addEventListener(evt, this._unlockHandler, { capture: true, passive: true });
      document.addEventListener(evt, this._unlockHandler, { capture: true, passive: true });
    });
  }

  _cleanupUnlockListeners() {
    if (!this._windowListenersAttached || !this._unlockHandler || typeof window === 'undefined') return;
    this._unlockEvents?.forEach(evt => {
      window.removeEventListener(evt, this._unlockHandler, { capture: true });
      document.removeEventListener(evt, this._unlockHandler, { capture: true });
    });
    this._windowListenersAttached = false;
  }

  unlockAudio() {
    this._ensureAudioContext();
    if (this.isPlayingBGM && !this.bgmMuted && this.bgmAudio) {
      if (this.bgmAudio.paused) {
        this.bgmAudio.play()
          .then(() => {
            this.isBgmUnlocked = true;
            if (this.world) this.world.eventBus.emit('AUDIO_UNLOCKED');
            this._cleanupUnlockListeners();
          })
          .catch(() => {});
      } else {
        this.isBgmUnlocked = true;
        if (this.world) this.world.eventBus.emit('AUDIO_UNLOCKED');
        this._cleanupUnlockListeners();
      }
    } else {
      if (this.world) this.world.eventBus.emit('AUDIO_UNLOCKED');
    }
  }

  _ensureAudioContext() {
    if (typeof window === 'undefined') return null;
    if (!this.audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        this.audioCtx = new AudioContextClass();
        this.sfxMasterGain = this.audioCtx.createGain();
        const effectiveGain = this.sfxMuted ? 0 : this.sfxVolume;
        this.sfxMasterGain.gain.setValueAtTime(effectiveGain, this.audioCtx.currentTime);
        this.sfxMasterGain.connect(this.audioCtx.destination);
      }
    }
    if (this.audioCtx && this.audioCtx.state === 'suspended') {
      this.audioCtx.resume().catch(() => {});
    }
    if (this.sfxMasterGain && this.audioCtx) {
      const effectiveGain = this.sfxMuted ? 0 : this.sfxVolume;
      this.sfxMasterGain.gain.setValueAtTime(effectiveGain, this.audioCtx.currentTime);
    }
    return this.audioCtx;
  }

  _getSfxDestination(ctx) {
    if (!this.sfxMasterGain && ctx) {
      this.sfxMasterGain = ctx.createGain();
      const effectiveGain = this.sfxMuted ? 0 : this.sfxVolume;
      this.sfxMasterGain.gain.setValueAtTime(effectiveGain, ctx.currentTime);
      this.sfxMasterGain.connect(ctx.destination);
    }
    return this.sfxMasterGain || ctx.destination;
  }

  init(world) {
    this.world = world;
    this._initBGM();
    this.startBGM();

    // Attach comprehensive unlock listeners so any early interaction starts sound immediately
    this._setupGlobalUnlockListeners();

    // Event bus subscriptions
    world.eventBus.on('PROJECTILE_FIRED', (event) => {
      this.playLaserSound(event.isCrit);
    });

    world.eventBus.on('DAMAGE_DEALT', (event) => {
      if (event.isCrit) {
        this.playCritSound();
      } else {
        this.playHitSound();
      }
    });

    world.eventBus.on('ENTITY_DIED', (event) => {
      this.playExplosionSound(event.enemyType);
    });

    world.eventBus.on('UPGRADE_PURCHASED', () => {
      this.playUpgradeSound();
    });

    world.eventBus.on('WAVE_STARTED', () => {
      this.playWaveAlertSound();
      // Ensure BGM plays right at the start of gameplay when enemies begin flying
      if (!this.bgmMuted && (!this.bgmAudio || this.bgmAudio.paused)) {
        this.startBGM();
      }
    });

    world.eventBus.on('WAVE_COMPLETED', () => {
      this.playWaveClearSound();
    });

    world.eventBus.on('GAME_OVER', () => {
      this.playGameOverSound();
      this.pauseBGM();
    });

    world.eventBus.on('RESTART_GAME', () => {
      this.resumeBGM();
    });
  }

  update(world, deltaTime) {
    // Audio is event-driven; no frame update required
  }

  // =========================================================================
  // SYNTHESIZED SOUND GENERATORS (SFX)
  // =========================================================================

  playLaserSound(isCrit) {
    if (this.sfxMuted || this.sfxVolume === 0) return;
    const ctx = this._ensureAudioContext();
    if (!ctx) return;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = isCrit ? 'sawtooth' : 'sine';
    const startFreq = isCrit ? 920 : 680;
    const endFreq = isCrit ? 220 : 180;

    osc.frequency.setValueAtTime(startFreq, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(endFreq, ctx.currentTime + 0.08);

    gain.gain.setValueAtTime(isCrit ? 0.08 : 0.05, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);

    osc.connect(gain);
    gain.connect(this._getSfxDestination(ctx));

    osc.start();
    osc.stop(ctx.currentTime + 0.08);
  }

  playHitSound() {
    if (this.sfxMuted || this.sfxVolume === 0) return;
    const ctx = this._ensureAudioContext();
    if (!ctx) return;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(320, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(90, ctx.currentTime + 0.04);

    gain.gain.setValueAtTime(0.03, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);

    osc.connect(gain);
    gain.connect(this._getSfxDestination(ctx));

    osc.start();
    osc.stop(ctx.currentTime + 0.04);
  }

  playCritSound() {
    if (this.sfxMuted || this.sfxVolume === 0) return;
    const ctx = this._ensureAudioContext();
    if (!ctx) return;

    // Dual-tone harmonic chime
    [1200, 1600].forEach((freq) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.2, ctx.currentTime + 0.12);

      gain.gain.setValueAtTime(0.06, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);

      osc.connect(gain);
      gain.connect(this._getSfxDestination(ctx));

      osc.start();
      osc.stop(ctx.currentTime + 0.12);
    });
  }

  playExplosionSound(enemyType) {
    if (this.sfxMuted || this.sfxVolume === 0) return;
    const ctx = this._ensureAudioContext();
    if (!ctx) return;

    const bufferSize = Math.floor(ctx.sampleRate * 0.2);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);

    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    const isHeavy = enemyType === 'tank';
    filter.frequency.setValueAtTime(isHeavy ? 350 : 600, ctx.currentTime);
    filter.frequency.linearRampToValueAtTime(60, ctx.currentTime + 0.2);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(isHeavy ? 0.18 : 0.10, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this._getSfxDestination(ctx));

    noise.start();
    noise.stop(ctx.currentTime + 0.2);
  }

  playUpgradeSound() {
    if (this.sfxMuted || this.sfxVolume === 0) return;
    const ctx = this._ensureAudioContext();
    if (!ctx) return;

    // Ascending arpeggio
    const notes = [440, 554, 659];
    notes.forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      const startTime = ctx.currentTime + idx * 0.05;
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, startTime);

      gain.gain.setValueAtTime(0.06, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.1);

      osc.connect(gain);
      gain.connect(this._getSfxDestination(ctx));

      osc.start(startTime);
      osc.stop(startTime + 0.1);
    });
  }

  playWaveAlertSound() {
    if (this.sfxMuted || this.sfxVolume === 0) return;
    const ctx = this._ensureAudioContext();
    if (!ctx) return;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(440, ctx.currentTime);
    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.09);

    gain.gain.setValueAtTime(0.05, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);

    osc.connect(gain);
    gain.connect(this._getSfxDestination(ctx));

    osc.start();
    osc.stop(ctx.currentTime + 0.22);
  }

  playWaveClearSound() {
    if (this.sfxMuted || this.sfxVolume === 0) return;
    const ctx = this._ensureAudioContext();
    if (!ctx) return;

    [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      const startTime = ctx.currentTime + idx * 0.06;
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, startTime);

      gain.gain.setValueAtTime(0.06, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.15);

      osc.connect(gain);
      gain.connect(this._getSfxDestination(ctx));

      osc.start(startTime);
      osc.stop(startTime + 0.15);
    });
  }

  playGameOverSound() {
    if (this.sfxMuted || this.sfxVolume === 0) return;
    const ctx = this._ensureAudioContext();
    if (!ctx) return;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(260, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.8);

    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);

    osc.connect(gain);
    gain.connect(this._getSfxDestination(ctx));

    osc.start();
    osc.stop(ctx.currentTime + 0.8);
  }
}

/**
 * RenderSystem.js
 * Renders the Geometric Neon Cyberpunk visual frame to HTML5 Canvas.
 * Strictly read-only: does not modify any component or entity state.
 */

class RenderSystem {
  constructor(canvas, particleSystem) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.particleSystem = particleSystem;
    this.gridOffset = 0;
    this.corePulseAngle = 0;
    this.radarRotation = 0;
    this.isRenderSystem = true;

    this._initParallaxSpace();
  }

  update(world, deltaTime) {
    const ctx = this.ctx;
    const width = this.canvas.width;
    const height = this.canvas.height;

    this.corePulseAngle += deltaTime * 2.5;
    this.radarRotation += deltaTime * 0.6;

    // Advance cosmic parallax drift (slow majestic drift across deep space)
    this.spaceTime += deltaTime;
    this.parallaxDriftX += deltaTime * 8.0;
    this.parallaxDriftY += deltaTime * 4.0;

    // 1. Draw Deep Cyber-Space with 3-Layer Parallax & Nebulae
    this._drawSpaceBackground(ctx, width, height, world);

    // 2. Draw tactical grids (strictly clipped to tower attack range and enemy shield domes)
    this._drawTacticalGrids(ctx, world, width, height);

    // 3. Draw Tower range ring and tower entity
    this._drawTowerAndRange(ctx, world);

    // 3.5 Draw Aegis defensive domes on the ground
    this._drawAegisDomes(ctx, world);

    // 4. Draw enemies and health bars
    this._drawEnemies(ctx, world);

    // 4b. Draw miniature health bar under the tower core (always visible and drawn on top of enemies)
    this._drawTowerMiniHealthBar(ctx, world);

    // 5. Draw projectiles
    this._drawProjectiles(ctx, world);

    // 6. Draw particles and shockwaves
    if (this.particleSystem) {
      this._drawParticles(ctx);
      this._drawShockwaves(ctx);
      this._drawFloatingTexts(ctx);
    }

    // 7. If paused and not game over, draw cyberpunk pause indicator
    if (world.isPaused && !world.isGameOver) {
      this._drawPauseOverlay(ctx, width, height);
    }
  }

  _drawPauseOverlay(ctx, width, height) {
    ctx.save();
    // Semi-transparent dark cinematic veil
    ctx.fillStyle = 'rgba(6, 9, 18, 0.45)';
    ctx.fillRect(0, 0, width, height);

    // Glowing badge in top-center
    const badgeW = 240;
    const badgeH = 54;
    const badgeX = (width - badgeW) / 2;
    const badgeY = 32;

    ctx.fillStyle = 'rgba(10, 16, 28, 0.88)';
    ctx.strokeStyle = '#00f3ff';
    ctx.shadowColor = '#00f3ff';
    ctx.shadowBlur = 16;
    ctx.lineWidth = 2;

    if (ctx.roundRect) {
      ctx.beginPath();
      ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 8);
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.fillRect(badgeX, badgeY, badgeW, badgeH);
      ctx.strokeRect(badgeX, badgeY, badgeW, badgeH);
    }

    // Title: ⏸ ПАУЗА
    ctx.font = '900 18px Orbitron, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#00f3ff';
    ctx.shadowColor = '#00f3ff';
    ctx.shadowBlur = 12;
    ctx.fillText('⏸ ПАУЗА', width / 2, badgeY + 20);

    // Subtitle: [ ПРОБЕЛ / P ]
    ctx.font = '700 11px Rajdhani, Orbitron, sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.shadowBlur = 0;
    ctx.fillText('НАЖМИТЕ ПРОБЕЛ / P ДЛЯ ИГРЫ', width / 2, badgeY + 40);

    ctx.restore();
  }

  _drawTacticalGrids(ctx, world, width, height) {
    // 1. Draw tactical coordinate grid inside the tower's attack range circle
    const towers = world.getEntitiesWith(TowerComponent, TransformComponent, AttackComponent);
    if (towers.length > 0) {
      const trans = world.getComponent(towers[0], TransformComponent);
      const attack = world.getComponent(towers[0], AttackComponent);
      if (attack && attack.range > 0) {
        this._drawTowerGrid(ctx, trans.x, trans.y, attack.range);
      }
    }

    // 2. Draw distinctive honeycomb shield grid inside each alive Aegis shield dome
    const enemies = world.getEntitiesWith(EnemyComponent, TransformComponent, HealthComponent);
    for (const id of enemies) {
      const enemyComp = world.getComponent(id, EnemyComponent);
      if (enemyComp && enemyComp.type === 'aegis') {
        const health = world.getComponent(id, HealthComponent);
        if (health && health.current > 0) {
          const trans = world.getComponent(id, TransformComponent);
          if (trans) {
            const r = enemyComp.shieldDomeRadius || 115;
            this._drawShieldHoneycombGrid(ctx, trans.x, trans.y, r);
          }
        }
      }
    }
  }

  _drawTowerGrid(ctx, cx, cy, range) {
    const gridSize = GameConfig.canvas.gridSize || 40;
    ctx.save();

    // Clip strictly to tower attack range
    ctx.beginPath();
    ctx.arc(cx, cy, range, 0, Math.PI * 2);
    ctx.clip();

    // Cyan tactical coordinate grid lines
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();

    const minX = Math.floor((cx - range) / gridSize) * gridSize;
    const maxX = Math.ceil((cx + range) / gridSize) * gridSize;
    const minY = Math.floor((cy - range) / gridSize) * gridSize;
    const maxY = Math.ceil((cy + range) / gridSize) * gridSize;

    for (let x = minX; x <= maxX; x += gridSize) {
      ctx.moveTo(x, cy - range);
      ctx.lineTo(x, cy + range);
    }
    for (let y = minY; y <= maxY; y += gridSize) {
      ctx.moveTo(cx - range, y);
      ctx.lineTo(cx + range, y);
    }
    ctx.stroke();

    // Subtle tactical intersection crosses (+)
    ctx.fillStyle = 'rgba(0, 243, 255, 0.22)';
    for (let x = minX; x <= maxX; x += gridSize) {
      for (let y = minY; y <= maxY; y += gridSize) {
        if (Math.hypot(x - cx, y - cy) <= range - 2) {
          ctx.fillRect(x - 2, y, 5, 1);
          ctx.fillRect(x, y - 2, 1, 5);
        }
      }
    }

    ctx.restore();
  }

  _drawShieldHoneycombGrid(ctx, cx, cy, radius) {
    ctx.save();

    // Clip strictly to shield dome circle
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.clip();

    const hexR = 18;
    const dx = Math.sqrt(3) * hexR;
    const dy = 1.5 * hexR;

    ctx.strokeStyle = 'rgba(0, 255, 170, 0.16)';
    ctx.lineWidth = 1;

    const minRow = Math.floor(-radius / dy) - 1;
    const maxRow = Math.ceil(radius / dy) + 1;
    const minCol = Math.floor(-radius / dx) - 1;
    const maxCol = Math.ceil(radius / dx) + 1;

    for (let row = minRow; row <= maxRow; row++) {
      const y = cy + row * dy;
      const xOffset = (row % 2 !== 0) ? dx * 0.5 : 0;
      for (let col = minCol; col <= maxCol; col++) {
        const x = cx + col * dx + xOffset;
        if (Math.hypot(x - cx, y - cy) <= radius + hexR) {
          this._drawHexagonPath(ctx, x, y, hexR * 0.90);
          ctx.stroke();
        }
      }
    }

    ctx.restore();
  }

  _drawHexagonPath(ctx, cx, cy, r) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i * Math.PI) / 3;
      const x = cx + r * Math.cos(a);
      const y = cy + r * Math.sin(a);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  _initParallaxSpace() {
    this.spaceTime = 0;
    this.parallaxDriftX = 0;
    this.parallaxDriftY = 0;

    // Layer 1: Distant micro-stars (deep space backdrop)
    this.distantStars = [];
    for (let i = 0; i < 95; i++) {
      this.distantStars.push({
        x: Math.random() * 2400,
        y: Math.random() * 1600,
        size: Math.random() * 1.3 + 0.6,
        alpha: Math.random() * 0.45 + 0.25,
        twinkleSpeed: Math.random() * 1.5 + 0.8,
        twinklePhase: Math.random() * Math.PI * 2,
        color: Math.random() < 0.6 ? '#ffffff' : (Math.random() < 0.5 ? '#a5f3fc' : '#c084fc')
      });
    }

    // Layer 2: Mid-distance geometric stars (diamonds, crosses, clusters)
    this.midStars = [];
    for (let i = 0; i < 42; i++) {
      const type = Math.random() < 0.45 ? 'diamond' : (Math.random() < 0.45 ? 'cross' : 'dot');
      this.midStars.push({
        x: Math.random() * 2400,
        y: Math.random() * 1600,
        size: Math.random() * 2.2 + 1.8,
        alpha: Math.random() * 0.45 + 0.45,
        twinkleSpeed: Math.random() * 2.0 + 1.2,
        twinklePhase: Math.random() * Math.PI * 2,
        color: Math.random() < 0.55 ? '#00f3ff' : (Math.random() < 0.6 ? '#00ffcc' : '#f472b6'),
        type
      });
    }

    // Predefined geometric constellation connections between nearby mid-stars
    this.constellations = [];
    for (let i = 0; i < this.midStars.length; i++) {
      for (let j = i + 1; j < this.midStars.length; j++) {
        const dx = this.midStars[i].x - this.midStars[j].x;
        const dy = this.midStars[i].y - this.midStars[j].y;
        const d = Math.hypot(dx, dy);
        if (d > 70 && d < 180 && this.constellations.length < 20) {
          this.constellations.push([i, j]);
        }
      }
    }

    // Layer 3: Foreground cyber-motes (drifting space dust / energy motes)
    this.foregroundMotes = [];
    for (let i = 0; i < 20; i++) {
      this.foregroundMotes.push({
        x: Math.random() * 2400,
        y: Math.random() * 1600,
        size: Math.random() * 2.5 + 2.0,
        alpha: Math.random() * 0.35 + 0.45,
        pulseSpeed: Math.random() * 2.2 + 1.0,
        pulsePhase: Math.random() * Math.PI * 2,
        color: Math.random() < 0.65 ? '#00f3ff' : '#ffe600'
      });
    }

    // Nebulae: 3 cosmic color clouds with slow orbital drift
    this.nebulae = [
      {
        baseX: 0.28,
        baseY: 0.32,
        radius: 480,
        color: 'rgba(0, 180, 216, 0.055)',
        accent: 'rgba(0, 243, 255, 0.015)',
        phase: 0
      },
      {
        baseX: 0.72,
        baseY: 0.68,
        radius: 520,
        color: 'rgba(147, 51, 234, 0.048)',
        accent: 'rgba(217, 70, 239, 0.012)',
        phase: 2.1
      },
      {
        baseX: 0.50,
        baseY: 0.50,
        radius: 380,
        color: 'rgba(6, 78, 119, 0.06)',
        accent: 'rgba(0, 243, 255, 0.02)',
        phase: 4.2
      }
    ];
  }

  _drawSpaceBackground(ctx, width, height, world) {
    ctx.save();

    // 1. Deep cosmic void
    ctx.fillStyle = '#050711';
    ctx.fillRect(0, 0, width, height);

    // 2. Cosmic nebulae clouds (slow breathing radial gradients)
    for (const neb of this.nebulae) {
      const nebX = (neb.baseX * width + Math.sin(this.spaceTime * 0.2 + neb.phase) * 60 - this.parallaxDriftX * 0.15);
      const nebY = (neb.baseY * height + Math.cos(this.spaceTime * 0.18 + neb.phase) * 45 - this.parallaxDriftY * 0.15);
      const wrapX = ((nebX % width) + width) % width;
      const wrapY = ((nebY % height) + height) % height;

      const r = neb.radius + Math.sin(this.spaceTime * 0.35 + neb.phase) * 35;
      const grad = ctx.createRadialGradient(wrapX, wrapY, r * 0.05, wrapX, wrapY, r);
      grad.addColorStop(0, neb.color);
      grad.addColorStop(0.65, neb.accent);
      grad.addColorStop(1, 'rgba(5, 7, 17, 0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(wrapX, wrapY, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // 3. Layer 1: Distant Micro-Stars (Parallax factor: 0.35)
    const drift1X = this.parallaxDriftX * 0.35;
    const drift1Y = this.parallaxDriftY * 0.35;
    for (const s of this.distantStars) {
      const x = ((s.x - drift1X) % width + width) % width;
      const y = ((s.y - drift1Y) % height + height) % height;
      const twinkle = 0.7 + 0.3 * Math.sin(this.spaceTime * s.twinkleSpeed + s.twinklePhase);
      ctx.globalAlpha = Math.max(0.1, Math.min(1, s.alpha * twinkle));
      ctx.fillStyle = s.color;
      ctx.fillRect(x, y, s.size, s.size);
    }

    // 4. Layer 2: Mid-Distance Geometric Stars & Constellations (Parallax factor: 0.70)
    const drift2X = this.parallaxDriftX * 0.70;
    const drift2Y = this.parallaxDriftY * 0.70;

    // Draw faint constellation links between nearby stars
    ctx.lineWidth = 0.8;
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.08)';
    for (const [i, j] of this.constellations) {
      const s1 = this.midStars[i];
      const s2 = this.midStars[j];
      const x1 = ((s1.x - drift2X) % width + width) % width;
      const y1 = ((s1.y - drift2Y) % height + height) % height;
      const x2 = ((s2.x - drift2X) % width + width) % width;
      const y2 = ((s2.y - drift2Y) % height + height) % height;

      // Only draw line if stars haven't wrapped across opposite screen boundaries
      if (Math.abs(x1 - x2) < 220 && Math.abs(y1 - y2) < 220) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
    }

    // Draw mid-distance stars (diamonds, crosses, glowing dots)
    for (const s of this.midStars) {
      const x = ((s.x - drift2X) % width + width) % width;
      const y = ((s.y - drift2Y) % height + height) % height;
      const twinkle = 0.65 + 0.35 * Math.sin(this.spaceTime * s.twinkleSpeed + s.twinklePhase);
      const alpha = Math.max(0.15, Math.min(1, s.alpha * twinkle));

      ctx.globalAlpha = alpha;
      ctx.fillStyle = s.color;
      ctx.strokeStyle = s.color;

      if (s.type === 'diamond') {
        // 4-pointed diamond spark
        const r = s.size;
        ctx.beginPath();
        ctx.moveTo(x, y - r);
        ctx.lineTo(x + r * 0.65, y);
        ctx.lineTo(x, y + r);
        ctx.lineTo(x - r * 0.65, y);
        ctx.closePath();
        ctx.fill();
      } else if (s.type === 'cross') {
        // 4-pointed cross star flare
        const arm = s.size * 1.3;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x - arm, y);
        ctx.lineTo(x + arm, y);
        ctx.moveTo(x, y - arm);
        ctx.lineTo(x, y + arm);
        ctx.stroke();
        ctx.fillRect(x - 0.75, y - 0.75, 1.5, 1.5);
      } else {
        // Glowing dot
        ctx.beginPath();
        ctx.arc(x, y, s.size * 0.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 5. Layer 3: Foreground Cyber Motes (Parallax factor: 1.25)
    const drift3X = this.parallaxDriftX * 1.25;
    const drift3Y = this.parallaxDriftY * 1.25;
    for (const m of this.foregroundMotes) {
      const x = ((m.x - drift3X) % width + width) % width;
      const y = ((m.y - drift3Y) % height + height) % height;
      const pulse = 0.65 + 0.35 * Math.sin(this.spaceTime * m.pulseSpeed + m.pulsePhase);
      const alpha = Math.max(0.1, Math.min(1, m.alpha * pulse));

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = m.color;
      ctx.shadowColor = m.color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(x, y, m.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.restore();
  }

  _drawTowerAndRange(ctx, world) {
    const towers = world.getEntitiesWith(TowerComponent, TransformComponent, AttackComponent, RenderComponent);
    if (towers.length === 0) return;

    const towerId = towers[0];
    const trans = world.getComponent(towerId, TransformComponent);
    const attack = world.getComponent(towerId, AttackComponent);
    const render = world.getComponent(towerId, RenderComponent);
    const targetComp = world.getComponent(towerId, TargetComponent);

    ctx.save();

    // 1. Redesigned Visible Cyber Attack Range Field
    this._drawRangeField(ctx, trans.x, trans.y, attack.range);

    // 2. Target lock-on brackets
    if (targetComp && targetComp.targetEntityId) {
      const enemyTrans = world.getComponent(targetComp.targetEntityId, TransformComponent);
      if (enemyTrans) {
        this._drawLockOnReticle(ctx, enemyTrans.x, enemyTrans.y);
      }
    }

    // 3. Tower base (tech octagon)
    ctx.save();
    ctx.translate(trans.x, trans.y);
    ctx.shadowColor = render.glowColor;
    ctx.shadowBlur = render.glowBlur;

    // Outer octagonal armor
    ctx.fillStyle = '#0d1520';
    ctx.strokeStyle = render.color;
    ctx.lineWidth = 3;
    this._drawPolygonPath(ctx, 0, 0, render.radius, 8, Math.PI / 8);
    ctx.fill();
    ctx.stroke();

    // Inner mechanical details
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.4)';
    ctx.lineWidth = 1.5;
    this._drawPolygonPath(ctx, 0, 0, render.radius * 0.7, 8, 0);
    ctx.stroke();

    // 4. Rotating energy core
    const corePulse = 0.85 + Math.sin(this.corePulseAngle) * 0.15;
    ctx.save();
    ctx.rotate(this.corePulseAngle * 0.5);
    ctx.fillStyle = '#00f3ff';
    ctx.shadowColor = '#00f3ff';
    ctx.shadowBlur = 15;
    this._drawPolygonPath(ctx, 0, 0, render.radius * 0.35 * corePulse, 4, 0);
    ctx.fill();
    ctx.restore();

    // 5. Weapon turret barrel pointing towards rotation
    ctx.rotate(trans.rotation);
    ctx.fillStyle = '#102233';
    ctx.strokeStyle = '#00f3ff';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#00f3ff';
    ctx.shadowBlur = 10;

    // Dual railgun barrels
    const barrelLength = render.radius + 14;
    const barrelWidth = 4;
    const barrelGap = 5;

    // Left barrel
    ctx.fillRect(4, -barrelGap - barrelWidth / 2, barrelLength, barrelWidth);
    ctx.strokeRect(4, -barrelGap - barrelWidth / 2, barrelLength, barrelWidth);

    // Right barrel
    ctx.fillRect(4, barrelGap - barrelWidth / 2, barrelLength, barrelWidth);
    ctx.strokeRect(4, barrelGap - barrelWidth / 2, barrelLength, barrelWidth);

    // Muzzle capacitor
    ctx.fillStyle = '#00f3ff';
    ctx.fillRect(barrelLength - 2, -barrelGap - barrelWidth / 2, 4, barrelWidth);
    ctx.fillRect(barrelLength - 2, barrelGap - barrelWidth / 2, 4, barrelWidth);

    ctx.restore();
    ctx.restore();
  }

  _drawTowerMiniHealthBar(ctx, world) {
    const towers = world.getEntitiesWith(TowerComponent, TransformComponent, RenderComponent, HealthComponent);
    if (towers.length === 0) return;

    const towerId = towers[0];
    const trans = world.getComponent(towerId, TransformComponent);
    const render = world.getComponent(towerId, RenderComponent);
    const health = world.getComponent(towerId, HealthComponent);
    if (!trans || !health) return;

    const x = trans.x;
    const y = trans.y + (render ? render.radius : 26) + 12;
    const barWidth = 52;
    const barHeight = 5;
    const halfW = barWidth / 2;
    const pct = Math.max(0, Math.min(1, health.current / health.max));

    ctx.save();

    // High-contrast cyber background with dark stroke
    ctx.fillStyle = 'rgba(5, 8, 14, 0.9)';
    ctx.fillRect(x - halfW - 1, y - 1, barWidth + 2, barHeight + 2);

    ctx.strokeStyle = 'rgba(0, 243, 255, 0.45)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x - halfW - 1, y - 1, barWidth + 2, barHeight + 2);

    // Dynamic glowing health fill: green -> yellow -> red alert
    let fillColor = '#00ff88';
    if (pct <= 0.25) {
      fillColor = '#ff0055';
    } else if (pct <= 0.5) {
      fillColor = '#ffe600';
    }

    ctx.fillStyle = fillColor;
    ctx.shadowColor = fillColor;
    ctx.shadowBlur = 8;
    ctx.fillRect(x - halfW, y, barWidth * pct, barHeight);

    ctx.restore();
  }

  _drawRangeField(ctx, cx, cy, range) {
    ctx.save();

    // 1. Cyberpunk radial gradient aura
    const radGrad = ctx.createRadialGradient(cx, cy, range * 0.15, cx, cy, range);
    radGrad.addColorStop(0, 'rgba(0, 243, 255, 0.005)');
    radGrad.addColorStop(0.65, 'rgba(0, 243, 255, 0.03)');
    radGrad.addColorStop(0.9, 'rgba(0, 243, 255, 0.07)');
    radGrad.addColorStop(1, 'rgba(0, 243, 255, 0.16)');

    ctx.fillStyle = radGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, range, 0, Math.PI * 2);
    ctx.fill();

    // 2. Inner concentric distance rings (Radar grid)
    // 50% distance ring
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.14)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.arc(cx, cy, range * 0.5, 0, Math.PI * 2);
    ctx.stroke();

    // 75% distance ring
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.18)';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 10]);
    ctx.beginPath();
    ctx.arc(cx, cy, range * 0.75, 0, Math.PI * 2);
    ctx.stroke();

    // 3. Animated outer perimeter (tech dashes)
    ctx.strokeStyle = '#00f3ff';
    ctx.shadowColor = '#00f3ff';
    ctx.shadowBlur = 14;
    ctx.lineWidth = 2.5;
    ctx.setLineDash([16, 12, 6, 12]);
    ctx.lineDashOffset = -this.radarRotation * 40;
    ctx.beginPath();
    ctx.arc(cx, cy, range, 0, Math.PI * 2);
    ctx.stroke();

    // Counter-rotating inner perimeter accent
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.35)';
    ctx.shadowBlur = 6;
    ctx.lineWidth = 1;
    ctx.setLineDash([24, 24]);
    ctx.lineDashOffset = this.radarRotation * 25;
    ctx.beginPath();
    ctx.arc(cx, cy, range - 5, 0, Math.PI * 2);
    ctx.stroke();

    ctx.setLineDash([]);

    // 4. Tactical radar crosshair ticks (8 compass points)
    ctx.strokeStyle = '#00f3ff';
    ctx.shadowColor = '#00f3ff';
    ctx.shadowBlur = 10;
    ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const angle = this.radarRotation * 0.25 + (i * Math.PI) / 4;
      const x1 = cx + (range - 8) * Math.cos(angle);
      const y1 = cy + (range - 8) * Math.sin(angle);
      const x2 = cx + (range + 8) * Math.cos(angle);
      const y2 = cy + (range + 8) * Math.sin(angle);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    // 5. Tactical range readout pill
    const tagAngle = -Math.PI / 2 + 0.38;
    const tagX = cx + (range + 16) * Math.cos(tagAngle);
    const tagY = cy + (range + 16) * Math.sin(tagAngle);

    ctx.font = '900 11px Orbitron, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#00f3ff';
    ctx.shadowColor = '#00f3ff';
    ctx.shadowBlur = 10;
    ctx.fillText(`ZONE: ${Math.round(range)}px`, tagX, tagY);

    ctx.restore();
  }

  _drawLockOnReticle(ctx, x, y) {
    ctx.save();
    ctx.strokeStyle = '#00f3ff';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = '#00f3ff';
    ctx.shadowBlur = 8;

    const r = 24;
    const corner = 6;

    // 4 corner reticle brackets
    // Top-Left
    ctx.beginPath();
    ctx.moveTo(x - r + corner, y - r);
    ctx.lineTo(x - r, y - r);
    ctx.lineTo(x - r, y - r + corner);
    ctx.stroke();

    // Top-Right
    ctx.beginPath();
    ctx.moveTo(x + r - corner, y - r);
    ctx.lineTo(x + r, y - r);
    ctx.lineTo(x + r, y - r + corner);
    ctx.stroke();

    // Bottom-Left
    ctx.beginPath();
    ctx.moveTo(x - r + corner, y + r);
    ctx.lineTo(x - r, y + r);
    ctx.lineTo(x - r, y + r - corner);
    ctx.stroke();

    // Bottom-Right
    ctx.beginPath();
    ctx.moveTo(x + r - corner, y + r);
    ctx.lineTo(x + r, y + r);
    ctx.lineTo(x + r, y + r - corner);
    ctx.stroke();

    ctx.restore();
  }

  _drawAegisDomes(ctx, world) {
    const enemies = world.getEntitiesWith(EnemyComponent, TransformComponent, HealthComponent);
    for (const id of enemies) {
      const enemyComp = world.getComponent(id, EnemyComponent);
      if (enemyComp && enemyComp.type === 'aegis') {
        const health = world.getComponent(id, HealthComponent);
        if (!health || health.current <= 0) continue;

        const trans = world.getComponent(id, TransformComponent);
        if (!trans) continue;

        const r = enemyComp.shieldDomeRadius || 115;

        ctx.save();
        // 1. Emerald-mint radial gradient forcefield aura (clearly distinct from cyan radar)
        const grad = ctx.createRadialGradient(trans.x, trans.y, r * 0.15, trans.x, trans.y, r);
        grad.addColorStop(0, 'rgba(0, 255, 170, 0.02)');
        grad.addColorStop(0.7, 'rgba(0, 255, 170, 0.08)');
        grad.addColorStop(1, 'rgba(0, 255, 170, 0.22)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(trans.x, trans.y, r, 0, Math.PI * 2);
        ctx.fill();

        // 2. Oscillating plasma wave perimeter (shimmering energy bubble)
        ctx.beginPath();
        const segments = 60;
        for (let i = 0; i <= segments; i++) {
          const a = (i / segments) * Math.PI * 2;
          const wave = Math.sin(a * 10 + this.spaceTime * 4.5) * 2.4;
          const px = trans.x + Math.cos(a) * (r + wave);
          const py = trans.y + Math.sin(a) * (r + wave);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.strokeStyle = '#00ffaa';
        ctx.shadowColor = '#00ffaa';
        ctx.shadowBlur = 14;
        ctx.lineWidth = 2.2;
        ctx.stroke();

        // 3. Counter-rotating inner energy ring
        ctx.strokeStyle = 'rgba(0, 255, 170, 0.40)';
        ctx.lineWidth = 1.2;
        ctx.setLineDash([12, 10]);
        ctx.lineDashOffset = this.spaceTime * 25;
        ctx.beginPath();
        ctx.arc(trans.x, trans.y, r - 5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);

        // 4. 5 Shield Emitter Nodes at pentagon vertices
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#00ffaa';
        ctx.shadowBlur = 10;
        for (let i = 0; i < 5; i++) {
          const a = trans.rotation + (i * Math.PI * 2) / 5;
          const nx = trans.x + Math.cos(a) * r;
          const ny = trans.y + Math.sin(a) * r;

          ctx.beginPath();
          ctx.arc(nx, ny, 3.5, 0, Math.PI * 2);
          ctx.fill();

          // Faint energy conduit line to center pentagon
          ctx.strokeStyle = 'rgba(0, 255, 170, 0.18)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(trans.x, trans.y);
          ctx.lineTo(nx, ny);
          ctx.stroke();
        }

        // 5. Shield Status Badge
        ctx.font = '900 10px Orbitron, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#00ffaa';
        ctx.shadowColor = '#00ffaa';
        ctx.shadowBlur = 8;
        ctx.fillText('🛡️ ЩИТ: -50% УРОНА', trans.x, trans.y - r - 10);

        ctx.restore();
      }
    }
  }

  _drawEnemies(ctx, world) {
    const enemies = world.getEntitiesWith(EnemyComponent, TransformComponent, RenderComponent, HealthComponent);

    for (const id of enemies) {
      const trans = world.getComponent(id, TransformComponent);
      const render = world.getComponent(id, RenderComponent);
      const health = world.getComponent(id, HealthComponent);
      const enemy = world.getComponent(id, EnemyComponent);

      ctx.save();
      ctx.translate(trans.x, trans.y);
      ctx.rotate(trans.rotation);

      ctx.shadowColor = render.glowColor;
      ctx.shadowBlur = render.glowBlur;
      ctx.fillStyle = '#0a0d14';
      ctx.strokeStyle = render.color;
      ctx.lineWidth = 2.5;

      if (enemy.type === 'fighter') {
        // Fighter: aerodynamic dart shape
        this._drawDartPath(ctx, render.radius);
        ctx.fill();
        ctx.stroke();
      } else if (enemy.type === 'aegis') {
        // Aegis: 5-sided pentagon with concentric inner core
        this._drawPolygonPath(ctx, 0, 0, render.radius, 5, -Math.PI / 2);
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 1.2;
        this._drawPolygonPath(ctx, 0, 0, render.radius * 0.52, 5, -Math.PI / 2);
        ctx.stroke();
        ctx.restore();
      } else if (enemy.type === 'splitter') {
        // Splitter: green triangular fractal
        this._drawSierpinskiTriangle(ctx, render.radius);
      } else if (enemy.type === 'splitter_shard') {
        // Splitter Shard: mini green triangle
        this._drawPolygonPath(ctx, 0, 0, render.radius, 3, -Math.PI / 2);
        ctx.fill();
        ctx.stroke();
      } else if (enemy.type === 'blinker') {
        // Blinker: white/cyan lightning zigzag vector
        this._drawLightningBolt(ctx, render.radius);
        ctx.fill();
        ctx.stroke();
      } else if (enemy.type === 'boss_architect') {
        // Boss Architect: giant star fractal
        this._drawStarFractal(ctx, render.radius);
      } else if (enemy.type === 'boss_shield') {
        // Boss orbital shield segment
        this._drawShieldSegment(ctx, render.radius);
      } else {
        // Scout (3-sided), Tank (6-sided), Sniper (4-sided diamond)
        this._drawPolygonPath(ctx, 0, 0, render.radius, render.sides, 0);
        ctx.fill();
        ctx.stroke();

        // Inner geometric accent
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 1;
        if (enemy.type === 'tank') {
          this._drawPolygonPath(ctx, 0, 0, render.radius * 0.55, 6, Math.PI / 6);
          ctx.stroke();
        } else if (enemy.type === 'sniper') {
          // Sniper charging optic core
          ctx.fillStyle = render.color;
          ctx.beginPath();
          ctx.arc(0, 0, 3.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.restore();

      // Health bar above enemy
      if (enemy.type === 'boss_architect') {
        // Persistent clean health bar for boss (pure bar, no text or numbers)
        this._drawBossHealthBar(ctx, trans.x, trans.y - render.radius - 12, 110, health.current, health.max);
      } else if (health.current < health.max) {
        this._drawHealthBar(ctx, trans.x, trans.y - render.radius - 8, render.radius * 2, health.current, health.max);
      }
    }
  }

  _drawSierpinskiTriangle(ctx, radius) {
    // Outer triangle
    this._drawPolygonPath(ctx, 0, 0, radius, 3, -Math.PI / 2);
    ctx.fill();
    ctx.stroke();

    // Inverted inner cutout triangle to form Sierpinski fractal pattern
    ctx.save();
    ctx.strokeStyle = 'rgba(0, 255, 102, 0.85)';
    ctx.lineWidth = 1.3;
    this._drawPolygonPath(ctx, 0, 0, radius * 0.5, 3, Math.PI / 2);
    ctx.stroke();

    // Central core accent dot
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0, 0, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  _drawLightningBolt(ctx, radius) {
    const r = radius;
    ctx.beginPath();
    // Sharp neon zigzag bolt facing along +X axis
    ctx.moveTo(r * 1.35, 0);          // Forward tip
    ctx.lineTo(r * 0.1, -r * 0.75);    // Top forward angle
    ctx.lineTo(r * 0.22, -r * 0.22);   // Top inner notch
    ctx.lineTo(-r * 0.8, -r * 0.85);   // Top tail
    ctx.lineTo(-r * 0.25, 0);          // Tail center notch
    ctx.lineTo(-r * 0.85, r * 0.8);    // Bottom tail
    ctx.lineTo(0.1, r * 0.2);          // Bottom inner notch
    ctx.lineTo(-0.05, r * 0.7);        // Bottom forward angle
    ctx.closePath();
  }

  _drawStarFractal(ctx, radius) {
    // Outer 8-point star
    this._drawStarPath(ctx, 0, 0, 8, radius, radius * 0.55);
    ctx.fill();
    ctx.stroke();

    // Inner counter-rotated 8-point star
    ctx.save();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    this._drawStarPath(ctx, 0, 0, 8, radius * 0.5, radius * 0.25, Math.PI / 8);
    ctx.stroke();

    // Central pulsating core
    const pulse = Math.sin(this.corePulseAngle * 2.5) * 2;
    ctx.fillStyle = '#ff0055';
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(0, 0, 7 + pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  _drawStarPath(ctx, cx, cy, points, outerR, innerR, angleOffset = 0) {
    ctx.beginPath();
    const total = points * 2;
    for (let i = 0; i < total; i++) {
      const angle = angleOffset + (i * Math.PI) / points;
      const r = i % 2 === 0 ? outerR : innerR;
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  _drawShieldSegment(ctx, radius) {
    const w = radius * 1.4;
    const h = radius * 0.7;
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(-w, -h / 2, w * 2, h, 3);
    } else {
      ctx.rect(-w, -h / 2, w * 2, h);
    }
    ctx.fill();
    ctx.stroke();

    ctx.save();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-w * 0.6, 0);
    ctx.lineTo(w * 0.6, 0);
    ctx.stroke();
    ctx.restore();
  }

  _drawBossHealthBar(ctx, x, y, width, current, max) {
    const barWidth = Math.max(110, width);
    const height = 8;
    const halfW = barWidth / 2;
    const pct = Math.max(0, Math.min(1, current / max));

    ctx.save();
    // High-contrast dark background
    ctx.fillStyle = 'rgba(5, 8, 14, 0.95)';
    ctx.fillRect(x - halfW - 2, y - 2, barWidth + 4, height + 4);

    ctx.strokeStyle = '#ff0055';
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 8;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x - halfW - 2, y - 2, barWidth + 4, height + 4);

    // Crimson neon fill
    ctx.fillStyle = '#ff0055';
    ctx.fillRect(x - halfW, y, barWidth * pct, height);

    ctx.restore();
  }

  _drawDartPath(ctx, radius) {
    ctx.beginPath();
    ctx.moveTo(radius * 1.3, 0); // Pointy tip forward
    ctx.lineTo(-radius, radius * 0.9); // Wing tip right
    ctx.lineTo(-radius * 0.5, 0); // Inner notch
    ctx.lineTo(-radius, -radius * 0.9); // Wing tip left
    ctx.closePath();
  }

  _drawHealthBar(ctx, x, y, width, current, max) {
    const barWidth = Math.max(28, width);
    const height = 5;
    const halfW = barWidth / 2;
    const pct = Math.max(0, Math.min(1, current / max));

    ctx.save();
    // High-contrast background with dark stroke
    ctx.fillStyle = 'rgba(5, 8, 14, 0.9)';
    ctx.fillRect(x - halfW - 1, y - 1, barWidth + 2, height + 2);

    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1;
    ctx.strokeRect(x - halfW - 1, y - 1, barWidth + 2, height + 2);

    // Glowing neon fill
    ctx.fillStyle = pct > 0.4 ? '#00ff66' : '#ff0055';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 6;
    ctx.fillRect(x - halfW, y, barWidth * pct, height);
    ctx.restore();
  }

  _drawProjectiles(ctx, world) {
    const projectiles = world.getEntitiesWith(ProjectileComponent, TransformComponent, RenderComponent);

    for (const id of projectiles) {
      const trans = world.getComponent(id, TransformComponent);
      const render = world.getComponent(id, RenderComponent);
      const proj = world.getComponent(id, ProjectileComponent);

      ctx.save();
      ctx.translate(trans.x, trans.y);
      ctx.rotate(trans.rotation);

      ctx.shadowColor = render.glowColor;
      ctx.shadowBlur = render.glowBlur;
      ctx.fillStyle = render.color;

      if (!proj.isEnemy) {
        // Player neon bolt
        const length = proj.isCrit ? 16 : 12;
        const width = proj.isCrit ? 5 : 3.5;
        ctx.fillRect(-length / 2, -width / 2, length, width);
      } else {
        // Sniper beam sphere
        ctx.beginPath();
        ctx.arc(0, 0, render.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }
  }

  _drawParticles(ctx) {
    const particles = this.particleSystem.getParticles();
    for (const p of particles) {
      const alpha = Math.max(0, Math.min(1, p.life / p.maxLife));
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    }
  }

  _drawShockwaves(ctx) {
    const shockwaves = this.particleSystem.getShockwaves();
    for (const sw of shockwaves) {
      const alpha = Math.max(0, Math.min(1, sw.life / sw.maxLife));
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = sw.color;
      ctx.lineWidth = sw.lineWidth;
      ctx.shadowColor = sw.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  _drawFloatingTexts(ctx) {
    const texts = this.particleSystem.getFloatingTexts();
    for (const ft of texts) {
      const alpha = Math.max(0, Math.min(1, ft.life / ft.maxLife));
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = `900 ${ft.fontSize}px 'Rajdhani', 'Orbitron', 'Segoe UI', monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // 1. High-contrast dark outline so text pops on any background
      ctx.lineWidth = ft.isCrit ? 4 : 3;
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.95)';
      ctx.shadowBlur = 0; // clear shadow for crisp border
      ctx.strokeText(ft.text, ft.x, ft.y);

      // 2. Bright glowing fill
      ctx.fillStyle = ft.color;
      ctx.shadowColor = ft.color;
      ctx.shadowBlur = ft.isCrit ? 16 : 8;
      ctx.fillText(ft.text, ft.x, ft.y);

      ctx.restore();
    }
  }

  _drawPolygonPath(ctx, cx, cy, radius, sides, startAngle = 0) {
    ctx.beginPath();
    for (let i = 0; i < sides; i++) {
      const a = startAngle + (i * 2 * Math.PI) / sides;
      const x = cx + radius * Math.cos(a);
      const y = cy + radius * Math.sin(a);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }
}

/**
 * UpgradeManager.js
 * Handles upgrade calculations, exponential cost scaling, and mutation
 * of component parameters upon purchase.
 */

class UpgradeManager {
  constructor() {
    this.levels = new Map();
    // Initialize all 12 upgrades to level 0
    for (const key of Object.keys(GameConfig.upgrades)) {
      this.levels.set(key, 0);
    }
  }

  getLevel(upgradeId) {
    return this.levels.get(upgradeId) || 0;
  }

  getCost(upgradeId) {
    const def = GameConfig.upgrades[upgradeId];
    if (!def) return Infinity;
    const lvl = this.getLevel(upgradeId);
    if (def.maxLevel && lvl >= def.maxLevel) return Infinity;
    return Math.round(def.baseCost * Math.pow(def.costMultiplier, lvl));
  }

  canAfford(upgradeId, credits) {
    const cost = this.getCost(upgradeId);
    return credits >= cost && isFinite(cost);
  }

  getCurrentValue(upgradeId) {
    const lvl = this.getLevel(upgradeId);
    const def = GameConfig.upgrades[upgradeId];
    if (!def) return 0;

    switch (upgradeId) {
      case 'damage':
        return GameConfig.tower.baseDamage + lvl * def.valuePerLevel;
      case 'attackSpeed':
        return GameConfig.tower.baseAttackSpeed + lvl * def.valuePerLevel;
      case 'critChance':
        return GameConfig.tower.baseCritChance + lvl * def.valuePerLevel;
      case 'critDamage':
        return GameConfig.tower.baseCritMultiplier + lvl * def.valuePerLevel;
      case 'multishotChance':
        return GameConfig.tower.baseMultishotChance + lvl * def.valuePerLevel;
      case 'multishotTargets':
        return GameConfig.tower.baseMultishotCount + lvl * def.valuePerLevel;
      case 'range': {
        const effectiveLvl = def.maxLevel ? Math.min(lvl, def.maxLevel) : lvl;
        return GameConfig.tower.baseRange + effectiveLvl * def.valuePerLevel;
      }
      case 'distanceDamage':
        return (GameConfig.tower.baseDistanceDamageCoeff || 0.001) + lvl * def.valuePerLevel;
      case 'maxHealth':
        return GameConfig.tower.baseHealth + lvl * def.valuePerLevel;
      case 'armorPercent':
        return Math.min(0.85, GameConfig.tower.basePercentArmor + lvl * def.valuePerLevel);
      case 'flatArmor':
        return GameConfig.tower.baseFlatArmor + lvl * def.valuePerLevel;
      case 'healthRegen':
        return GameConfig.tower.baseRegen + lvl * def.valuePerLevel;
      case 'killCashBonus':
        return 1.0 + lvl * def.valuePerLevel;
      case 'waveCashBonus':
        return 1.0 + lvl * def.valuePerLevel;
      default:
        return 0;
    }
  }

  getNextValue(upgradeId) {
    const lvl = this.getLevel(upgradeId) + 1;
    const def = GameConfig.upgrades[upgradeId];
    if (!def) return 0;

    switch (upgradeId) {
      case 'damage':
        return GameConfig.tower.baseDamage + lvl * def.valuePerLevel;
      case 'attackSpeed':
        return GameConfig.tower.baseAttackSpeed + lvl * def.valuePerLevel;
      case 'critChance':
        return GameConfig.tower.baseCritChance + lvl * def.valuePerLevel;
      case 'critDamage':
        return GameConfig.tower.baseCritMultiplier + lvl * def.valuePerLevel;
      case 'multishotChance':
        return GameConfig.tower.baseMultishotChance + lvl * def.valuePerLevel;
      case 'multishotTargets':
        return GameConfig.tower.baseMultishotCount + lvl * def.valuePerLevel;
      case 'range': {
        const effectiveLvl = def.maxLevel ? Math.min(lvl, def.maxLevel) : lvl;
        return GameConfig.tower.baseRange + effectiveLvl * def.valuePerLevel;
      }
      case 'distanceDamage':
        return (GameConfig.tower.baseDistanceDamageCoeff || 0.001) + lvl * def.valuePerLevel;
      case 'maxHealth':
        return GameConfig.tower.baseHealth + lvl * def.valuePerLevel;
      case 'armorPercent':
        return Math.min(0.85, GameConfig.tower.basePercentArmor + lvl * def.valuePerLevel);
      case 'flatArmor':
        return GameConfig.tower.baseFlatArmor + lvl * def.valuePerLevel;
      case 'healthRegen':
        return GameConfig.tower.baseRegen + lvl * def.valuePerLevel;
      case 'killCashBonus':
        return 1.0 + lvl * def.valuePerLevel;
      case 'waveCashBonus':
        return 1.0 + lvl * def.valuePerLevel;
      default:
        return 0;
    }
  }

  buyUpgrade(upgradeId, world) {
    const cost = this.getCost(upgradeId);
    if (!isFinite(cost)) return false;

    // Check credits on tower economy
    const towers = world.getEntitiesWith(TowerComponent, EconomyComponent);
    if (towers.length === 0) return false;

    const towerId = towers[0];
    const economy = world.getComponent(towerId, EconomyComponent);

    if (economy.credits < cost) return false;

    // Increment level
    const currentLvl = this.getLevel(upgradeId);
    this.levels.set(upgradeId, currentLvl + 1);

    // Apply stats to component
    this._applyToTower(upgradeId, world, towerId);

    // Notify event bus
    world.eventBus.emit('UPGRADE_PURCHASED', {
      upgradeId,
      cost,
      newLevel: currentLvl + 1
    });

    return true;
  }

  _applyToTower(upgradeId, world, towerId) {
    const attack = world.getComponent(towerId, AttackComponent);
    const health = world.getComponent(towerId, HealthComponent);
    const armor = world.getComponent(towerId, ArmorComponent);
    const economy = world.getComponent(towerId, EconomyComponent);

    const newVal = this.getCurrentValue(upgradeId);

    switch (upgradeId) {
      case 'damage':
        if (attack) attack.damage = newVal;
        break;
      case 'attackSpeed':
        if (attack) attack.attackSpeed = newVal;
        break;
      case 'critChance':
        if (attack) attack.critChance = newVal;
        break;
      case 'critDamage':
        if (attack) attack.critMultiplier = newVal;
        break;
      case 'multishotChance':
        if (attack) attack.multishotChance = newVal;
        break;
      case 'multishotTargets':
        if (attack) attack.multishotCount = newVal;
        break;
      case 'range':
        if (attack) {
          const maxScreenRange = (world && world.height) ? Math.floor((world.height / 2) - 20) : 290;
          attack.range = Math.min(newVal, Math.max(GameConfig.tower.baseRange, maxScreenRange));
        }
        break;
      case 'distanceDamage':
        if (attack) attack.distanceBonus = newVal;
        break;
      case 'maxHealth':
        if (health) {
          const diff = newVal - health.max;
          health.max = newVal;
          health.current = Math.min(health.max, health.current + diff);
        }
        break;
      case 'armorPercent':
        if (armor) armor.percentReduction = newVal;
        break;
      case 'flatArmor':
        if (armor) armor.flatReduction = newVal;
        break;
      case 'healthRegen':
        if (health) health.regenRate = newVal;
        break;
      case 'killCashBonus':
        if (economy) economy.killMultiplier = newVal;
        break;
      case 'waveCashBonus':
        if (economy) economy.waveMultiplier = newVal;
        break;
    }
  }

  getAllUpgrades() {
    return Object.values(GameConfig.upgrades).map(def => ({
      ...def,
      level: this.getLevel(def.id),
      cost: this.getCost(def.id),
      currentVal: this.getCurrentValue(def.id),
      nextVal: this.getNextValue(def.id)
    }));
  }
}
