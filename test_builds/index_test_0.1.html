<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometric Neon Cyberpunk - Tower Defense ECS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
/* ==========================================================================
   GEOMETRIC NEON CYBERPUNK THEME - TOWER DEFENSE
   HIGH-READABILITY & HIGH-CONTRAST REFINED STYLESHEET
   ========================================================================== */

:root {
  --bg-main: #06080e;
  --bg-panel: #0d131f;
  --bg-card: #131c2b;
  --bg-card-hover: #1b263b;
  
  --border-neon: rgba(0, 243, 255, 0.45);
  --border-neon-bright: #00f3ff;
  --border-dim: rgba(0, 243, 255, 0.25);
  
  --neon-cyan: #00f3ff;
  --neon-yellow: #ffe600;
  --neon-crimson: #ff1a66;
  --neon-purple: #a824ff;
  --neon-orange: #ff7700;
  --neon-green: #00ff88;

  --text-main: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-dim: #94a3b8;
  --text-cyan: #00f3ff;
  
  --font-cyber: 'Orbitron', 'Segoe UI', system-ui, sans-serif;
  --font-ui: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'Consolas', 'Courier New', monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
}

body {
  background-color: var(--bg-main);
  color: var(--text-main);
  font-family: var(--font-ui);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

/* ==========================================================================
   GAME CONTAINER & LAYOUT
   ========================================================================== */

#game-app {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  position: relative;
}

/* TOP STATUS HUD */
#top-hud {
  height: 74px;
  background: linear-gradient(180deg, #0e1524 0%, rgba(11, 16, 28, 0.96) 100%);
  border-bottom: 2px solid var(--border-neon);
  box-shadow: 0 6px 25px rgba(0, 0, 0, 0.8), 0 1px 0 rgba(0, 243, 255, 0.3);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  z-index: 20;
}

.hud-group {
  display: flex;
  align-items: center;
  gap: 16px;
}

.hud-badge {
  font-family: var(--font-cyber);
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 1.5px;
  padding: 8px 18px;
  background: rgba(0, 243, 255, 0.12);
  border: 2px solid var(--neon-cyan);
  border-radius: 6px;
  color: #ffffff;
  text-shadow: 0 0 10px rgba(0, 243, 255, 0.8), 0 2px 4px rgba(0, 0, 0, 0.8);
  box-shadow: 0 0 14px rgba(0, 243, 255, 0.25);
  display: flex;
  align-items: center;
  gap: 6px;
}

.hud-badge.enemies {
  color: #ffe600;
  border-color: var(--neon-yellow);
  background: rgba(255, 230, 0, 0.12);
  text-shadow: 0 0 10px rgba(255, 230, 0, 0.8), 0 2px 4px rgba(0, 0, 0, 0.8);
  box-shadow: 0 0 14px rgba(255, 230, 0, 0.25);
}

.hud-credits {
  font-family: var(--font-cyber);
  font-size: 22px;
  font-weight: 900;
  color: #ffe600;
  text-shadow: 0 0 12px rgba(255, 230, 0, 0.8), 0 2px 4px #000000;
  background: rgba(255, 230, 0, 0.08);
  border: 1.5px solid rgba(255, 230, 0, 0.45);
  border-radius: 6px;
  padding: 6px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: transform 0.15s ease, color 0.15s ease;
}

.hud-credits.pulse {
  transform: scale(1.18);
  color: #ffffff;
  border-color: #ffffff;
  box-shadow: 0 0 20px #ffe600;
}

/* Intermission countdown centered in top bar */
#intermission-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 320px;
  transition: opacity 0.3s ease;
}

#intermission-container.hidden {
  opacity: 0;
  pointer-events: none;
}

#intermission-text {
  font-family: var(--font-cyber);
  font-size: 14px;
  font-weight: 900;
  color: #ffe600;
  letter-spacing: 2px;
  margin-bottom: 6px;
  text-shadow: 0 0 14px rgba(255, 230, 0, 0.9), 0 2px 4px #000000;
  animation: neon-glow-pulse 1.2s infinite alternate;
}

@keyframes neon-glow-pulse {
  0% { text-shadow: 0 0 10px rgba(255, 230, 0, 0.7); }
  100% { text-shadow: 0 0 20px rgba(255, 230, 0, 1), 0 0 30px rgba(0, 243, 255, 0.6); }
}

.intermission-bar-bg {
  width: 100%;
  height: 12px;
  background: rgba(0, 0, 0, 0.7);
  border: 2px solid rgba(0, 243, 255, 0.45);
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 0 12px rgba(0, 243, 255, 0.25), inset 0 2px 4px rgba(0, 0, 0, 0.8);
}

#intermission-bar {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #00f3ff, #ffe600);
  box-shadow: 0 0 15px #00f3ff, 0 0 25px rgba(255, 230, 0, 0.7);
  transition: width 0.1s linear;
}

/* Tower HP Bar */
.hp-container {
  display: flex;
  flex-direction: column;
  width: 250px;
}

.hp-bar-bg {
  width: 100%;
  height: 14px;
  background: rgba(0, 0, 0, 0.7);
  border: 2px solid rgba(255, 26, 102, 0.6);
  border-radius: 4px;
  overflow: hidden;
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8);
}

#hud-hp-fill {
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, var(--neon-crimson), var(--neon-green));
  box-shadow: 0 0 12px rgba(0, 255, 136, 0.7);
  transition: width 0.2s ease;
}

#hud-hp-text {
  font-family: var(--font-ui);
  font-size: 16.5px;
  font-weight: 800;
  color: #ffffff;
  text-shadow: 0 1px 3px #000000, 0 0 6px rgba(0, 243, 255, 0.4);
  text-align: right;
  margin-top: 4px;
  letter-spacing: 0.5px;
}

/* Speed Controls Group */
.speed-controls {
  display: flex;
  align-items: center;
  background: rgba(0, 243, 255, 0.08);
  border: 2px solid var(--border-neon);
  border-radius: 6px;
  padding: 2px;
  gap: 2px;
  box-shadow: 0 0 10px rgba(0, 243, 255, 0.15);
}

.speed-btn {
  background: transparent;
  border: none;
  color: #94a3b8;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
  font-family: var(--font-cyber);
  font-weight: 800;
  font-size: 14px;
  letter-spacing: 0.5px;
  transition: all 0.15s ease;
}

.speed-btn:hover {
  color: #ffffff;
  background: rgba(0, 243, 255, 0.2);
}

.speed-btn.active {
  background: var(--neon-cyan);
  color: #060912;
  box-shadow: 0 0 14px rgba(0, 243, 255, 0.9);
  font-weight: 900;
  text-shadow: none;
}

.speed-btn.pause-btn {
  padding: 6px 10px;
  color: #00f3ff;
  border-right: 1px solid rgba(0, 243, 255, 0.25);
  border-radius: 4px 0 0 4px;
}

.speed-btn.pause-btn:hover {
  background: rgba(0, 243, 255, 0.25);
  color: #ffffff;
}

.speed-btn.pause-btn.active {
  background: #ff0055;
  color: #ffffff;
  box-shadow: 0 0 16px rgba(255, 0, 85, 0.95);
  border-color: #ff0055;
  animation: pause-pulse 1.2s infinite alternate;
}

@keyframes pause-pulse {
  0% { box-shadow: 0 0 8px rgba(255, 0, 85, 0.6); }
  100% { box-shadow: 0 0 20px rgba(255, 0, 85, 1); }
}

/* Speed and Audio Buttons */
.icon-btn {
  background: rgba(0, 243, 255, 0.12);
  border: 2px solid var(--border-neon);
  color: #ffffff;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-family: var(--font-cyber);
  font-weight: 800;
  font-size: 15px;
  letter-spacing: 1px;
  transition: all 0.2s ease;
  text-shadow: 0 0 8px var(--neon-cyan);
}

.icon-btn:hover {
  background: rgba(0, 243, 255, 0.3);
  border-color: var(--neon-cyan);
  box-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
  color: #ffffff;
}

.icon-btn.active {
  background: var(--neon-cyan);
  color: #060912;
  box-shadow: 0 0 20px rgba(0, 243, 255, 0.9);
  text-shadow: none;
}

.icon-btn.muted {
  opacity: 0.6;
}

/* Audio Controls Group (SFX & BGM) */
.audio-controls-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

.audio-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  font-family: var(--font-cyber);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.8px;
  background: rgba(0, 243, 255, 0.1);
  border: 1.5px solid var(--border-neon);
  border-radius: 6px;
  color: #ffffff;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
  user-select: none;
}

.audio-btn:hover {
  background: rgba(0, 243, 255, 0.25);
  border-color: var(--neon-cyan);
  box-shadow: 0 0 12px rgba(0, 243, 255, 0.5);
}

.audio-btn.muted {
  border-color: rgba(255, 26, 102, 0.5);
  background: rgba(255, 26, 102, 0.1);
  color: #ff8fae;
  box-shadow: none;
  opacity: 0.75;
}

.audio-btn .audio-icon {
  font-size: 15px;
}

.audio-btn .audio-label {
  font-size: 12px;
  letter-spacing: 0.5px;
}



/* ==========================================================================
   MAIN GAMEPLAY VIEW (CANVAS + SIDEBAR)
   ========================================================================== */

#game-viewport {
  flex: 1;
  display: flex;
  position: relative;
  overflow: hidden;
}

/* CANVAS */
#canvas-wrapper {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: var(--bg-main);
}

#game-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* Canvas targeting overlay control */
#strategy-overlay {
  position: absolute;
  bottom: 24px;
  left: 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: rgba(10, 15, 26, 0.94);
  border: 2px solid var(--border-neon);
  border-radius: 8px;
  padding: 12px 18px;
  backdrop-filter: blur(10px);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7), 0 0 15px rgba(0, 243, 255, 0.2);
  z-index: 10;
}

.overlay-label {
  font-family: var(--font-cyber);
  font-size: 12px;
  letter-spacing: 1.5px;
  color: #a8c5e2;
  font-weight: 900;
  text-shadow: 0 0 6px rgba(0, 243, 255, 0.4);
}

.strat-buttons {
  display: flex;
  gap: 8px;
}

.strat-btn {
  background: rgba(255, 255, 255, 0.06);
  border: 1.5px solid rgba(255, 255, 255, 0.2);
  color: #e2f4ff;
  padding: 8px 14px;
  font-size: 14px;
  font-family: var(--font-ui);
  font-weight: 800;
  letter-spacing: 0.5px;
  cursor: pointer;
  border-radius: 5px;
  transition: all 0.2s ease;
}

.strat-btn:hover {
  border-color: var(--neon-cyan);
  color: #ffffff;
  background: rgba(0, 243, 255, 0.15);
  box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
}

.strat-btn.active {
  background: rgba(0, 243, 255, 0.25);
  border-color: var(--neon-cyan);
  color: #ffffff;
  box-shadow: 0 0 14px rgba(0, 243, 255, 0.6);
  text-shadow: 0 0 8px var(--neon-cyan);
}

/* ==========================================================================
   UPGRADE SIDEBAR
   ========================================================================== */

#sidebar {
  width: 380px;
  background-color: var(--bg-panel);
  border-left: 2px solid var(--border-neon);
  display: flex;
  flex-direction: column;
  z-index: 15;
  box-shadow: -6px 0 30px rgba(0, 0, 0, 0.7);
}

.sidebar-header {
  padding: 18px 20px;
  border-bottom: 2px solid var(--border-neon);
  font-family: var(--font-cyber);
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 2px;
  color: var(--neon-cyan);
  text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
  background: rgba(0, 0, 0, 0.3);
}

/* TABS */
.tabs-container {
  display: flex;
  border-bottom: 2px solid var(--border-neon);
  background: rgba(0, 0, 0, 0.35);
}

.tab-btn {
  flex: 1;
  padding: 14px 8px;
  background: transparent;
  border: none;
  border-bottom: 3px solid transparent;
  color: #94a3b8;
  font-family: var(--font-cyber);
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.tab-btn:hover {
  color: #ffffff;
  background: rgba(0, 243, 255, 0.08);
}

.tab-btn.active {
  color: var(--neon-cyan);
  border-bottom-color: var(--neon-cyan);
  background: rgba(0, 243, 255, 0.12);
  text-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
  box-shadow: inset 0 -3px 10px rgba(0, 243, 255, 0.3);
}

/* UPGRADES LIST */
#upgrades-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

#upgrades-list::-webkit-scrollbar {
  width: 8px;
}

#upgrades-list::-webkit-scrollbar-track {
  background: rgba(0, 0, 0, 0.5);
  border-left: 1px solid rgba(0, 243, 255, 0.15);
}

#upgrades-list::-webkit-scrollbar-thumb {
  background: var(--neon-cyan);
  border-radius: 4px;
  box-shadow: 0 0 10px var(--neon-cyan);
}

/* UPGRADE CARD */
.upgrade-card {
  background-color: var(--bg-card);
  border: 1.5px solid rgba(0, 243, 255, 0.25);
  border-radius: 8px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.4);
  transition: all 0.2s ease;
}

.upgrade-card:hover {
  background-color: var(--bg-card-hover);
  border-color: var(--neon-cyan);
  box-shadow: 0 4px 18px rgba(0, 243, 255, 0.25);
}

.upgrade-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.upgrade-title {
  font-family: var(--font-ui);
  font-size: 16px;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.upgrade-lvl {
  font-family: var(--font-cyber);
  font-size: 12px;
  font-weight: 800;
  padding: 3px 8px;
  background: rgba(0, 243, 255, 0.12);
  border: 1.5px solid var(--neon-cyan);
  border-radius: 4px;
  color: var(--neon-cyan);
  text-shadow: 0 0 6px var(--neon-cyan);
}

.upgrade-stats {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-ui);
  font-size: 15px;
  font-weight: 700;
}

.stat-current {
  color: var(--text-secondary);
}

.stat-arrow {
  color: var(--neon-cyan);
  font-size: 18px;
  font-weight: 900;
}

.stat-next {
  color: var(--neon-green);
  font-size: 16px;
  font-weight: 800;
  text-shadow: 0 0 8px rgba(0, 255, 136, 0.6);
}

.upgrade-buy-btn {
  background: rgba(0, 243, 255, 0.15);
  border: 2px solid var(--neon-cyan);
  color: #ffffff;
  font-family: var(--font-cyber);
  font-size: 14px;
  font-weight: 900;
  padding: 10px 14px;
  border-radius: 5px;
  cursor: pointer;
  letter-spacing: 1px;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-shadow: 0 0 8px var(--neon-cyan);
  box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
}

.upgrade-buy-btn:hover:not(:disabled) {
  background: var(--neon-cyan);
  color: #060912;
  box-shadow: 0 0 20px rgba(0, 243, 255, 0.8);
  text-shadow: none;
}

.upgrade-buy-btn.disabled,
.upgrade-buy-btn:disabled {
  opacity: 0.45;
  border-color: rgba(255, 255, 255, 0.12);
  color: #64748b;
  background: rgba(255, 255, 255, 0.04);
  cursor: not-allowed;
  box-shadow: none;
  text-shadow: none;
}

.upgrade-card.maxed {
  border-color: rgba(0, 255, 136, 0.45);
}

.upgrade-card.maxed .upgrade-lvl {
  color: var(--neon-green);
  border-color: rgba(0, 255, 136, 0.6);
  text-shadow: 0 0 6px var(--neon-green);
}

/* ==========================================================================
   GAME OVER MODAL
   ========================================================================== */

.modal-backdrop {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(7, 10, 16, 0.92);
  backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  transition: opacity 0.3s ease;
}

.modal-backdrop.hidden {
  opacity: 0;
  pointer-events: none;
}

.modal-content {
  background: var(--bg-panel);
  border: 3px solid var(--neon-crimson);
  border-radius: 10px;
  padding: 44px 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  box-shadow: 0 0 50px rgba(255, 26, 102, 0.6), 0 0 100px rgba(0, 0, 0, 0.9);
  text-align: center;
  max-width: 480px;
}

.modal-title {
  font-family: var(--font-cyber);
  font-size: 32px;
  font-weight: 900;
  color: var(--neon-crimson);
  letter-spacing: 4px;
  text-shadow: 0 0 25px rgba(255, 26, 102, 0.9);
}

.modal-body {
  font-family: var(--font-ui);
  font-size: 18px;
  font-weight: 700;
  color: #e2f4ff;
  display: flex;
  flex-direction: column;
  gap: 10px;
  line-height: 1.6;
}

#modal-final-wave {
  font-family: var(--font-cyber);
  font-weight: 900;
  color: var(--neon-cyan);
  text-shadow: 0 0 10px var(--neon-cyan);
}

.modal-btn {
  background: rgba(255, 26, 102, 0.2);
  border: 2px solid var(--neon-crimson);
  color: #ffffff;
  font-family: var(--font-cyber);
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 2px;
  padding: 14px 30px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 0 20px rgba(255, 26, 102, 0.5);
}

.modal-btn:hover {
  background: var(--neon-crimson);
  color: #060912;
  box-shadow: 0 0 35px rgba(255, 26, 102, 0.9);
}

</style>
</head>
<body>
  <div id="game-app">
    <!-- TOP STATUS HUD -->
    <header id="top-hud">
      <div class="hud-group">
        <div id="hud-wave" class="hud-badge">ВОЛНА 01</div>
        <div id="hud-enemies" class="hud-badge enemies">ВРАГИ: 0</div>
      </div>

      <!-- 5-SECOND INTERMISSION COUNTDOWN BAR -->
      <div id="intermission-container" class="hidden">
        <div id="intermission-text">ПЕРЕРЫВ: 5.0s (ВОЛНА 02)</div>
        <div class="intermission-bar-bg">
          <div id="intermission-bar"></div>
        </div>
      </div>

      <!-- CREDITS & HEALTH -->
      <div class="hud-group">
        <div id="hud-credits" class="hud-credits">100 ◈</div>
        
        <div class="hp-container">
          <div class="hp-bar-bg">
            <div id="hud-hp-fill"></div>
          </div>
          <div id="hud-hp-text">600 / 600 (+1.0/с)</div>
        </div>

        <div class="speed-controls" id="speed-controls">
          <button id="btn-pause" class="speed-btn pause-btn" title="Пауза (Пробел / P)">⏸</button>
          <button id="btn-speed-1" class="speed-btn active" data-speed="1" title="Скорость 1x (1)">1x</button>
          <button id="btn-speed-2" class="speed-btn" data-speed="2" title="Скорость 2x (2)">2x</button>
          <button id="btn-speed-3" class="speed-btn" data-speed="3" title="Скорость 3x (3)">3x</button>
        </div>
        <div class="audio-controls-group">
          <button id="btn-sound-sfx" class="icon-btn audio-btn" title="Звуки игры: 100% (Клик: изменить громкость, ПКМ: выкл)">
            <span class="audio-icon">🔊</span>
            <span class="audio-label">ЗВУК</span>
          </button>
          <button id="btn-sound-music" class="icon-btn audio-btn" title="Фоновая музыка: 100% (Клик: изменить громкость, ПКМ: выкл)">
            <span class="audio-icon">🎵</span>
            <span class="audio-label">МУЗЫКА</span>
          </button>
        </div>
      </div>
    </header>

/**
 * EntityManager.js
 * Manages allocation, lifecycle, and recycling of unique Entity IDs.
 */

class EntityManager {
  constructor() {
    this.nextId = 1;
    this.freeIds = [];
    this.activeEntities = new Set();
  }

  /**
   * Allocate a new unique Entity ID
   * @returns {number}
   */
  createEntity() {
    let id;
    if (this.freeIds.length > 0) {
      id = this.freeIds.pop();
    } else {
      id = this.nextId++;
    }
    this.activeEntities.add(id);
    return id;
  }

  /**
   * Mark an Entity ID as destroyed and reclaim it for reuse
   * @param {number} id
   */
  destroyEntity(id) {
    if (this.activeEntities.has(id)) {
      this.activeEntities.delete(id);
      this.freeIds.push(id);
      return true;
    }
    return false;
  }

  /**
   * Check if an entity is alive
   * @param {number} id
   * @returns {boolean}
   */
  isAlive(id) {
    return this.activeEntities.has(id);
  }

  /**
   * Get all active entity IDs
   * @returns {Set<number>}
   */
  getActiveEntities() {
    return this.activeEntities;
  }

  /**
   * Reset manager state
   */
  clear() {
    this.nextId = 1;
    this.freeIds = [];
    this.activeEntities.clear();
  }
}

/**
 * EventBus.js
 * Decoupled publish-subscribe event system for cross-system and UI communication.
 */

class EventBus {
  constructor() {
    this.listeners = new Map();
  }

  /**
   * Subscribe to an event
   * @param {string} event
   * @param {Function} callback
   * @returns {Function} Unsubscribe function
   */
  on(event, callback) {
    if (!this.listeners.has(event)) {
      this.listeners.set(event, new Set());
    }
    this.listeners.get(event).add(callback);

    return () => this.off(event, callback);
  }

  /**
   * Unsubscribe from an event
   * @param {string} event
   * @param {Function} callback
   */
  off(event, callback) {
    const set = this.listeners.get(event);
    if (set) {
      set.delete(callback);
      if (set.size === 0) {
        this.listeners.delete(event);
      }
    }
  }

  /**
   * Publish an event to all subscribers
   * @param {string} event
   * @param {*} data
   */
  emit(event, data) {
    const set = this.listeners.get(event);
    if (set) {
      for (const callback of set) {
        try {
          callback(data);
        } catch (err) {
          console.error(`Error in EventBus listener for event "${event}":`, err);
        }
      }
    }
  }

  /**
   * Remove all listeners
   */
  clear() {
    this.listeners.clear();
  }
}

/**
 * World.js
 * Central ECS World managing entities, component pools, systems execution, and deferred cleanup.
 */

class World {
  constructor() {
    this.entityManager = new EntityManager();
    this.eventBus = new EventBus();
    
    // Map<ComponentClass, Map<entityId, componentInstance>>
    this.componentStores = new Map();
    
    // Systems in execution order
    this.systems = [];

    // Entities queued for destruction at the end of the frame
    this.destructionQueue = new Set();

    // Runtime state
    this.isPaused = false;
    this.gameSpeed = 1.0;
    this.isGameOver = false;

    // Viewport dimensions
    this.width = 1200;
    this.height = 800;
  }

  /**
   * Helper to resolve component store key
   * @private
   */
  _getStoreKey(ComponentClass) {
    return ComponentClass;
  }

  /**
   * Helper to ensure component store exists
   * @private
   */
  _getStore(ComponentClass) {
    let store = this.componentStores.get(ComponentClass);
    if (!store) {
      store = new Map();
      this.componentStores.set(ComponentClass, store);
    }
    return store;
  }

  /**
   * Create a new entity ID
   * @returns {number}
   */
  createEntity() {
    return this.entityManager.createEntity();
  }

  /**
   * Attach a component instance to an entity
   * @param {number} entityId
   * @param {Object} componentInstance
   * @returns {Object} componentInstance
   */
  addComponent(entityId, componentInstance) {
    if (!this.entityManager.isAlive(entityId)) {
      console.warn(`Cannot add component to dead or non-existent entity ${entityId}`);
      return componentInstance;
    }
    const ComponentClass = componentInstance.constructor;
    const store = this._getStore(ComponentClass);
    store.set(entityId, componentInstance);
    return componentInstance;
  }

  /**
   * Retrieve a component instance for an entity
   * @param {number} entityId
   * @param {Function} ComponentClass
   * @returns {Object|null}
   */
  getComponent(entityId, ComponentClass) {
    const store = this.componentStores.get(ComponentClass);
    if (!store) return null;
    return store.get(entityId) || null;
  }

  /**
   * Check if an entity has a specific component
   * @param {number} entityId
   * @param {Function} ComponentClass
   * @returns {boolean}
   */
  hasComponent(entityId, ComponentClass) {
    const store = this.componentStores.get(ComponentClass);
    if (!store) return false;
    return store.has(entityId);
  }

  /**
   * Remove a component from an entity
   * @param {number} entityId
   * @param {Function} ComponentClass
   */
  removeComponent(entityId, ComponentClass) {
    const store = this.componentStores.get(ComponentClass);
    if (store) {
      store.delete(entityId);
    }
  }

  /**
   * Query all entities matching ALL specified component classes
   * @param  {...Function} componentClasses
   * @returns {number[]} Array of entity IDs
   */
  getEntitiesWith(...componentClasses) {
    if (componentClasses.length === 0) {
      return Array.from(this.entityManager.getActiveEntities());
    }

    // Find the smallest component pool for optimal iteration
    let smallestStore = null;
    let smallestSize = Infinity;

    for (const CompClass of componentClasses) {
      const store = this.componentStores.get(CompClass);
      if (!store || store.size === 0) {
        return []; // If any component pool is empty, intersection is empty
      }
      if (store.size < smallestSize) {
        smallestSize = store.size;
        smallestStore = store;
      }
    }

    const matches = [];
    for (const entityId of smallestStore.keys()) {
      // Skip queued for destruction
      if (this.destructionQueue.has(entityId)) continue;

      let hasAll = true;
      for (const CompClass of componentClasses) {
        const store = this.componentStores.get(CompClass);
        if (!store || !store.has(entityId)) {
          hasAll = false;
          break;
        }
      }
      if (hasAll) {
        matches.push(entityId);
      }
    }

    return matches;
  }

  /**
   * Queue an entity for deferred removal at the end of the current update tick
   * @param {number} entityId
   */
  destroyEntity(entityId) {
    if (this.entityManager.isAlive(entityId)) {
      this.destructionQueue.add(entityId);
    }
  }

  /**
   * Process deferred entity destructions and clean component pools
   * @private
   */
  _flushDestructionQueue() {
    if (this.destructionQueue.size === 0) return;

    for (const entityId of this.destructionQueue) {
      // Remove all components for this entity
      for (const store of this.componentStores.values()) {
        store.delete(entityId);
      }
      // Reclaim entity ID
      this.entityManager.destroyEntity(entityId);
    }
    this.destructionQueue.clear();
  }

  /**
   * Register a system to run on each frame
   * @param {Object} system
   */
  registerSystem(system) {
    if (typeof system.init === 'function') {
      system.init(this);
    }
    this.systems.push(system);
  }

  /**
   * Update all systems by deltaTime
   * @param {number} deltaTime In seconds
   */
  update(deltaTime) {
    if (this.isPaused) {
      // While paused, only run read-only render systems with 0 delta time
      for (const system of this.systems) {
        if (system.isRenderSystem || system.constructor.name === 'RenderSystem') {
          system.update(this, 0);
        }
      }
      return;
    }

    const scaledDt = deltaTime * this.gameSpeed;

    for (const system of this.systems) {
      system.update(this, scaledDt);
    }

    // Clean up dead entities safely between ticks
    this._flushDestructionQueue();
  }

  /**
   * Reset world and all entities
   */
  clear() {
    this.destructionQueue.clear();
    for (const store of this.componentStores.values()) {
      store.clear();
    }
    this.entityManager.clear();
    this.isGameOver = false;
  }
}

/**
 * MovementSystem.js
 * Updates entity positions and orientations strictly based on velocity vectors.
 */

class MovementSystem {
  init(world) {
    // When an entity dies, immediately disconnect homing on all projectiles targeting it
    world.eventBus.on('ENTITY_DIED', (event) => {
      const targetedProjectiles = world.getEntitiesWith(ProjectileComponent);
      for (const id of targetedProjectiles) {
        const proj = world.getComponent(id, ProjectileComponent);
        if (proj && proj.targetEntityId === event.entityId) {
          proj.targetEntityId = null;
        }
      }
    });
  }

  update(world, deltaTime) {
    // 1. Locate tower position and core collider radius
    const towerEntities = world.getEntitiesWith(TowerComponent, TransformComponent, CircleColliderComponent);
    let towerX = world.width / 2;
    let towerY = world.height / 2;
    let towerRadius = 26;

    if (towerEntities.length > 0) {
      const towerTrans = world.getComponent(towerEntities[0], TransformComponent);
      const towerCol = world.getComponent(towerEntities[0], CircleColliderComponent);
      towerX = towerTrans.x;
      towerY = towerTrans.y;
      if (towerCol) towerRadius = towerCol.radius;
    }

    // 2. Steer marching enemies towards tower (stopping and pressing up against core collider)
    const enemyEntities = world.getEntitiesWith(EnemyComponent, TransformComponent, VelocityComponent);
    for (const id of enemyEntities) {
      const transform = world.getComponent(id, TransformComponent);
      const velocity = world.getComponent(id, VelocityComponent);
      const enemyComp = world.getComponent(id, EnemyComponent);

      // Boss shield segments are locked to boss orbit, do not march independently
      if (enemyComp.type === 'boss_shield') {
        velocity.vx = 0;
        velocity.vy = 0;
        continue;
      }

      // Check if sniper is stopped at perimeter (handled by SniperAISystem)
      if (enemyComp.isSniper && enemyComp.isStopped) {
        velocity.vx = 0;
        velocity.vy = 0;
        continue;
      }

      // Check if enemy is in scatter burst phase (e.g. Splitter shards scattering backwards & to the sides)
      if (enemyComp.scatterTimer > 0) {
        enemyComp.scatterTimer -= deltaTime;
        if (enemyComp.rotationSpeed && enemyComp.rotationSpeed !== 0) {
          transform.rotation += enemyComp.rotationSpeed * deltaTime;
        }
        // Smoothly decelerate scatter impulse towards normal speed
        const damp = Math.pow(0.35, deltaTime);
        velocity.vx *= damp;
        velocity.vy *= damp;
        continue;
      }

      const dx = towerX - transform.x;
      const dy = towerY - transform.y;
      const dist = Math.hypot(dx, dy);

      const col = world.getComponent(id, CircleColliderComponent);
      const enemyRadius = col ? col.radius : 12;
      const stopDist = towerRadius + enemyRadius;

      // Handle Blinker 2-second teleport dash and projectile lock clearing
      if (enemyComp.type === 'blinker') {
        enemyComp.blinkCooldown = (enemyComp.blinkCooldown !== undefined ? enemyComp.blinkCooldown : 2.0) - deltaTime;
        if (enemyComp.blinkCooldown <= 0) {
          enemyComp.blinkCooldown = 2.0;
          if (dist > stopDist) {
            const teleportDist = Math.min(85, dist - stopDist);
            const nx = dx / dist;
            const ny = dy / dist;
            const oldX = transform.x;
            const oldY = transform.y;
            transform.x += nx * teleportDist;
            transform.y += ny * teleportDist;

            // Drop homing targeting locks from all active player projectiles targeting this blinker
            const targetedProjectiles = world.getEntitiesWith(ProjectileComponent);
            for (const pId of targetedProjectiles) {
              const proj = world.getComponent(pId, ProjectileComponent);
              if (proj && proj.targetEntityId === id) {
                proj.targetEntityId = null;
              }
            }

            world.eventBus.emit('BLINKER_DASH', {
              entityId: id,
              fromX: oldX,
              fromY: oldY,
              toX: transform.x,
              toY: transform.y
            });
          }
        }
      }

      if (dist > stopDist) {
        velocity.vx = (dx / dist) * velocity.currentSpeed;
        velocity.vy = (dy / dist) * velocity.currentSpeed;

        if (enemyComp.rotationSpeed && enemyComp.rotationSpeed !== 0) {
          transform.rotation += enemyComp.rotationSpeed * deltaTime;
        } else {
          transform.rotation = Math.atan2(dy, dx);
        }
      } else {
        // Enemy is pressing up against the tower core collider!
        velocity.vx = 0;
        velocity.vy = 0;

        // Clamp position firmly to the outer surface of the tower's core collider
        const safeDist = dist > 0.0001 ? dist : 0.0001;
        const nx = (transform.x - towerX) / safeDist;
        const ny = (transform.y - towerY) / safeDist;
        transform.x = towerX + nx * stopDist;
        transform.y = towerY + ny * stopDist;

        if (enemyComp.rotationSpeed && enemyComp.rotationSpeed !== 0) {
          transform.rotation += enemyComp.rotationSpeed * deltaTime;
        } else {
          // Point directly into the core
          transform.rotation = Math.atan2(dy, dx);
        }
      }
    }

    // 3. Steer homing player projectiles toward their target
    const targetedProjectiles = world.getEntitiesWith(ProjectileComponent, TransformComponent, VelocityComponent);
    for (const id of targetedProjectiles) {
      const proj = world.getComponent(id, ProjectileComponent);
      if (proj.targetEntityId && !proj.isEnemy) {
        const isTargetAlive = world.entityManager.isAlive(proj.targetEntityId) &&
                              !world.destructionQueue.has(proj.targetEntityId);
        const targetHealth = world.getComponent(proj.targetEntityId, HealthComponent);
        const isEnemy = world.hasComponent(proj.targetEntityId, EnemyComponent);

        if (!isTargetAlive || !targetHealth || targetHealth.current <= 0 || !isEnemy) {
          // Target died or was destroyed: disconnect homing permanently!
          // Projectile keeps its current velocity vector and flies straight forward.
          proj.targetEntityId = null;
        } else {
          const targetTrans = world.getComponent(proj.targetEntityId, TransformComponent);
          if (targetTrans) {
            const trans = world.getComponent(id, TransformComponent);
            const velocity = world.getComponent(id, VelocityComponent);
            const dx = targetTrans.x - trans.x;
            const dy = targetTrans.y - trans.y;
            const dist = Math.hypot(dx, dy);
            if (dist > 1) {
              velocity.vx = (dx / dist) * velocity.currentSpeed;
              velocity.vy = (dy / dist) * velocity.currentSpeed;
              trans.rotation = Math.atan2(dy, dx);
            }
          }
        }
      }
    }

    // 4. Integrate velocity into transform for all moving entities
    const movingEntities = world.getEntitiesWith(TransformComponent, VelocityComponent);
    for (const id of movingEntities) {
      const transform = world.getComponent(id, TransformComponent);
      const velocity = world.getComponent(id, VelocityComponent);

      transform.x += velocity.vx * deltaTime;
      transform.y += velocity.vy * deltaTime;
    }

    // 4.5 Update orbiting shield segments for Boss Architect
    for (const id of enemyEntities) {
      const enemyComp = world.getComponent(id, EnemyComponent);
      if (enemyComp && enemyComp.type === 'boss_architect') {
        const bossTrans = world.getComponent(id, TransformComponent);
        if (!bossTrans) continue;

        enemyComp.shieldOrbitAngle = (enemyComp.shieldOrbitAngle || 0) + (enemyComp.shieldOrbitSpeed || 1.25) * deltaTime;
        const orbitR = enemyComp.shieldOrbitRadius || 78;
        const shieldIds = enemyComp.shieldIds || [];
        const totalSlots = enemyComp.shieldCount || shieldIds.length;

        for (let i = 0; i < shieldIds.length; i++) {
          const sId = shieldIds[i];
          if (sId !== null && world.entityManager.isAlive(sId) && !world.destructionQueue.has(sId)) {
            const sTrans = world.getComponent(sId, TransformComponent);
            if (sTrans) {
              const segAngle = enemyComp.shieldOrbitAngle + (i / totalSlots) * Math.PI * 2;
              sTrans.x = bossTrans.x + Math.cos(segAngle) * orbitR;
              sTrans.y = bossTrans.y + Math.sin(segAngle) * orbitR;
              sTrans.rotation = segAngle + Math.PI / 2;
            }
          }
        }
      }
    }

    // 5. Clean up projectiles flying off-screen (bounds + 80px margin)
    const allProjectiles = world.getEntitiesWith(ProjectileComponent, TransformComponent);
    for (const id of allProjectiles) {
      const trans = world.getComponent(id, TransformComponent);
      if (trans.x < -80 || trans.x > world.width + 80 || trans.y < -80 || trans.y > world.height + 80) {
        world.destroyEntity(id);
      }
    }
  }
}

/**
 * PhysicsSeparationSystem.js
 * Prevents swarm clustering by applying soft-elastic mass-weighted repulsion
 * between overlapping circle colliders.
 */

class PhysicsSeparationSystem {
  update(world, deltaTime) {
    const pushStrength = GameConfig.physics.separationPushStrength || 0.65;
    const dynamicColliders = world.getEntitiesWith(TransformComponent, CircleColliderComponent)
      .filter(id => {
        const col = world.getComponent(id, CircleColliderComponent);
        return !col.isStatic;
      });

    const count = dynamicColliders.length;

    // 1. Pairwise collision resolution between dynamic bodies
    if (count >= 2) {
      for (let i = 0; i < count; i++) {
        const idA = dynamicColliders[i];
        const transA = world.getComponent(idA, TransformComponent);
        const colA = world.getComponent(idA, CircleColliderComponent);

        for (let j = i + 1; j < count; j++) {
          const idB = dynamicColliders[j];
          const transB = world.getComponent(idB, TransformComponent);
          const colB = world.getComponent(idB, CircleColliderComponent);

          const dx = transB.x - transA.x;
          const dy = transB.y - transA.y;
          const dist = Math.hypot(dx, dy);
          const minDist = colA.radius + colB.radius;

          if (dist < minDist) {
            // If perfectly overlapping, create a slight random divergence
            const safeDist = dist > 0.0001 ? dist : 0.0001;
            const nx = dist > 0.0001 ? dx / safeDist : (Math.random() - 0.5);
            const ny = dist > 0.0001 ? dy / safeDist : (Math.random() - 0.5);

            const overlap = minDist - safeDist;
            const totalMass = (colA.mass || 1) + (colB.mass || 1);

            // Inverse mass weighting: heavier body moves less, lighter body moves more
            const weightA = (colB.mass || 1) / totalMass;
            const weightB = (colA.mass || 1) / totalMass;

            const shift = overlap * pushStrength;

            transA.x -= nx * shift * weightA;
            transA.y -= ny * shift * weightA;

            transB.x += nx * shift * weightB;
            transB.y += ny * shift * weightB;
          }
        }
      }
    }

    // 2. Resolve dynamic colliders against central static tower core collider
    const towers = world.getEntitiesWith(TowerComponent, TransformComponent, CircleColliderComponent);
    if (towers.length > 0) {
      const towerTrans = world.getComponent(towers[0], TransformComponent);
      const towerCol = world.getComponent(towers[0], CircleColliderComponent);

      for (let i = 0; i < count; i++) {
        const id = dynamicColliders[i];
        const trans = world.getComponent(id, TransformComponent);
        const col = world.getComponent(id, CircleColliderComponent);

        const dx = trans.x - towerTrans.x;
        const dy = trans.y - towerTrans.y;
        const dist = Math.hypot(dx, dy);
        const minDist = towerCol.radius + col.radius;

        if (dist < minDist) {
          const safeDist = dist > 0.0001 ? dist : 0.0001;
          const nx = dx / safeDist;
          const ny = dy / safeDist;
          trans.x = towerTrans.x + nx * minDist;
          trans.y = towerTrans.y + ny * minDist;
        }
      }
    }
  }
}

/**
 * TargetingSystem.js
 * Scans for enemies within tower range and assigns targets based on strategy.
 */

class TargetingSystem {
  init(world) {
    // Clear targeted entity on death
    world.eventBus.on('ENTITY_DIED', (event) => {
      const towers = world.getEntitiesWith(TowerComponent, TargetComponent);
      for (const tId of towers) {
        const targetComp = world.getComponent(tId, TargetComponent);
        if (targetComp && targetComp.targetEntityId === event.entityId) {
          targetComp.targetEntityId = null;
        }
      }
    });
  }

  update(world, deltaTime) {
    const towers = world.getEntitiesWith(TowerComponent, AttackComponent, TargetComponent, TransformComponent);
    if (towers.length === 0) return;

    const towerId = towers[0];
    const towerTrans = world.getComponent(towerId, TransformComponent);
    const attack = world.getComponent(towerId, AttackComponent);
    const targetComp = world.getComponent(towerId, TargetComponent);

    // 1. Calculate in-flight damage targeted at each enemy by active player projectiles
    const inFlightDamage = new Map();
    const projEntities = world.getEntitiesWith(ProjectileComponent);
    for (const pId of projEntities) {
      const proj = world.getComponent(pId, ProjectileComponent);
      if (proj && !proj.isEnemy && proj.targetEntityId) {
        inFlightDamage.set(proj.targetEntityId, (inFlightDamage.get(proj.targetEntityId) || 0) + (proj.damage || 0));
      }
    }

    // 2. Get all alive enemies strictly within attack range
    const enemyEntities = world.getEntitiesWith(EnemyComponent, TransformComponent, HealthComponent);
    const candidates = [];

    for (const enemyId of enemyEntities) {
      if (world.destructionQueue.has(enemyId)) continue;
      const enemyTrans = world.getComponent(enemyId, TransformComponent);
      const enemyHealth = world.getComponent(enemyId, HealthComponent);

      if (!enemyHealth || enemyHealth.current <= 0 || !enemyTrans) continue;

      const dist = Math.hypot(enemyTrans.x - towerTrans.x, enemyTrans.y - towerTrans.y);
      if (dist <= attack.range) {
        const inFlight = inFlightDamage.get(enemyId) || 0;
        candidates.push({
          id: enemyId,
          dist,
          health: enemyHealth.current,
          effectiveHp: enemyHealth.current - inFlight,
          x: enemyTrans.x,
          y: enemyTrans.y
        });
      }
    }

    if (candidates.length === 0) {
      targetComp.targetEntityId = null;
      return;
    }

    // 3. Predictive targeting: prioritize enemies that still need damage (effectiveHp > 0)
    const needyCandidates = candidates.filter(c => c.effectiveHp > 0);
    const pool = needyCandidates.length > 0 ? needyCandidates : candidates;

    // 4. Sort pool according to active strategy
    const strategy = targetComp.strategy || 'closest';
    if (strategy === 'closest') {
      pool.sort((a, b) => a.dist - b.dist);
    } else if (strategy === 'strongest') {
      pool.sort((a, b) => b.health - a.health);
    } else if (strategy === 'weakest') {
      pool.sort((a, b) => a.health - b.health);
    }

    const chosen = pool[0];
    targetComp.targetEntityId = chosen.id;

    // Rotate tower gun towards target
    const angle = Math.atan2(chosen.y - towerTrans.y, chosen.x - towerTrans.x);
    towerTrans.rotation = angle;
  }
}

/**
 * SniperAISystem.js
 * Controls long-range sniper enemies: halts them at the tower attack perimeter
 * and handles their ranged firing loop against the tower.
 */

class SniperAISystem {
  update(world, deltaTime) {
    const towers = world.getEntitiesWith(TowerComponent, TransformComponent, AttackComponent);
    if (towers.length === 0) return;

    const towerId = towers[0];
    const towerTrans = world.getComponent(towerId, TransformComponent);
    const towerAttack = world.getComponent(towerId, AttackComponent);

    const snipers = world.getEntitiesWith(EnemyComponent, TransformComponent, VelocityComponent)
      .filter(id => world.getComponent(id, EnemyComponent).isSniper);

    // Dynamically calculate stop distance tied to tower attack range (90% of range, max 240px)
    // Ensures snipers always stop within player attack zone regardless of upgrade path
    const currentRange = towerAttack ? towerAttack.range : GameConfig.tower.baseRange;
    const maxStopDist = GameConfig.enemies.sniper.stopDistance || 240;
    const stopDistance = Math.min(maxStopDist, Math.floor(currentRange * 0.90));

    for (const sniperId of snipers) {
      const enemy = world.getComponent(sniperId, EnemyComponent);
      const sniperTrans = world.getComponent(sniperId, TransformComponent);
      const velocity = world.getComponent(sniperId, VelocityComponent);

      const dx = towerTrans.x - sniperTrans.x;
      const dy = towerTrans.y - sniperTrans.y;
      const dist = Math.hypot(dx, dy);

      // Check perimeter threshold
      if (dist <= stopDistance) {
        if (!enemy.isStopped) {
          enemy.isStopped = true;
          // Initial aiming delay before first shot so tower has at least 0.3-0.45s to kill the sniper
          const aimDelay = GameConfig.enemies.sniper.initialAimDelay || 0.45;
          enemy.shootCooldown = Math.max(enemy.shootCooldown, aimDelay);
        }
        velocity.vx = 0;
        velocity.vy = 0;

        // Face towards the tower
        sniperTrans.rotation = Math.atan2(dy, dx);

        // Firing cycle
        if (enemy.shootCooldown > 0) {
          enemy.shootCooldown -= deltaTime;
        }

        if (enemy.shootCooldown <= 0) {
          enemy.shootCooldown = enemy.shootInterval || 2.8;
          this._fireSniperProjectile(world, sniperId, sniperTrans, towerId, towerTrans, enemy.damage);
        }
      } else {
        // Resume approach if pushed away or if tower range changed
        enemy.isStopped = false;
      }
    }
  }

  _fireSniperProjectile(world, sniperId, sniperTrans, towerId, towerTrans, scaledDamage) {
    const projId = world.createEntity();
    const dx = towerTrans.x - sniperTrans.x;
    const dy = towerTrans.y - sniperTrans.y;
    const dist = Math.hypot(dx, dy) || 1;
    const speed = GameConfig.enemies.sniper.projectileSpeed || 220;

    const vx = (dx / dist) * speed;
    const vy = (dy / dist) * speed;
    const angle = Math.atan2(dy, dx);

    const damage = scaledDamage || GameConfig.enemies.sniper.baseDamage || 22;

    world.addComponent(projId, new TransformComponent(sniperTrans.x, sniperTrans.y, angle));
    world.addComponent(projId, new VelocityComponent(vx, vy, speed, speed));
    world.addComponent(projId, new ProjectileComponent(
      sniperId,
      towerId,
      0,
      4.0, // maxLifetime
      damage,
      false, // isCrit
      true   // isEnemy = true
    ));
    world.addComponent(projId, new CircleColliderComponent(5, 0.1, false));
    world.addComponent(projId, new RenderComponent(
      'projectile',
      0,
      5,
      GameConfig.colors.enemyProjectile,
      GameConfig.colors.enemyProjectile,
      12
    ));

    world.eventBus.emit('ENEMY_SNIPER_SHOT', {
      sourceId: sniperId,
      x: sniperTrans.x,
      y: sniperTrans.y
    });
  }
}

/**
 * WeaponSystem.js
 * Manages attack timers, calculates critical strikes and multishot spreads,
 * and instantiates projectile entities.
 */

class WeaponSystem {
  update(world, deltaTime) {
    const towers = world.getEntitiesWith(TowerComponent, AttackComponent, TargetComponent, TransformComponent);
    if (towers.length === 0) return;

    const towerId = towers[0];
    const attack = world.getComponent(towerId, AttackComponent);
    const targetComp = world.getComponent(towerId, TargetComponent);
    const towerTrans = world.getComponent(towerId, TransformComponent);

    // Decrement attack cooldown
    if (attack.cooldown > 0) {
      attack.cooldown -= deltaTime;
    }

    if (attack.cooldown > 0) {
      return;
    }

    // 1. Calculate in-flight damage targeted at each enemy by player projectiles
    const inFlightDamage = new Map();
    const projEntities = world.getEntitiesWith(ProjectileComponent);
    for (const pId of projEntities) {
      const proj = world.getComponent(pId, ProjectileComponent);
      if (proj && !proj.isEnemy && proj.targetEntityId) {
        inFlightDamage.set(proj.targetEntityId, (inFlightDamage.get(proj.targetEntityId) || 0) + (proj.damage || 0));
      }
    }

    // 2. Scan for all living enemies strictly within attack range
    const enemyEntities = world.getEntitiesWith(EnemyComponent, TransformComponent, HealthComponent);
    const enemiesInRange = [];

    for (const enemyId of enemyEntities) {
      if (world.destructionQueue.has(enemyId)) continue;
      const eHealth = world.getComponent(enemyId, HealthComponent);
      const eTrans = world.getComponent(enemyId, TransformComponent);
      if (!eHealth || eHealth.current <= 0 || !eTrans) continue;

      const dist = Math.hypot(eTrans.x - towerTrans.x, eTrans.y - towerTrans.y);
      if (dist <= attack.range) {
        const inFlight = inFlightDamage.get(enemyId) || 0;
        enemiesInRange.push({
          id: enemyId,
          trans: eTrans,
          health: eHealth.current,
          effectiveHp: eHealth.current - inFlight,
          dist
        });
      }
    }

    if (enemiesInRange.length === 0) {
      targetComp.targetEntityId = null;
      return;
    }

    // 3. Predictive filtering: prioritize enemies that need damage
    const needyEnemies = enemiesInRange.filter(e => e.effectiveHp > 0);
    if (needyEnemies.length === 0) {
      // All enemies in range are already slated to die from incoming bullets!
      // Hold fire so we don't waste shots or send stray bullets into the void.
      return;
    }

    // Sort needy enemies according to targeting strategy
    const strategy = targetComp.strategy || 'closest';
    if (strategy === 'closest') {
      needyEnemies.sort((a, b) => a.dist - b.dist);
    } else if (strategy === 'strongest') {
      needyEnemies.sort((a, b) => b.health - a.health);
    } else if (strategy === 'weakest') {
      needyEnemies.sort((a, b) => a.health - b.health);
    }

    // Keep primary target consistent if it is in needyEnemies
    const primaryIndex = needyEnemies.findIndex(e => e.id === targetComp.targetEntityId);
    if (primaryIndex > 0) {
      const [primary] = needyEnemies.splice(primaryIndex, 1);
      needyEnemies.unshift(primary);
    } else if (primaryIndex === -1 && needyEnemies.length > 0) {
      targetComp.targetEntityId = needyEnemies[0].id;
    }

    const primaryTarget = needyEnemies[0];

    // Reset cooldown based on attack speed (attacks per second)
    attack.cooldown = 1 / Math.max(0.1, attack.attackSpeed);

    // Calculate critical hit
    const isCrit = Math.random() < attack.critChance;
    const baseDamage = attack.damage;
    const finalDamage = isCrit ? Math.round(baseDamage * attack.critMultiplier) : baseDamage;

    // Multishot calculation
    const triggersMultishot = Math.random() < attack.multishotChance;
    const maxCapacity = triggersMultishot ? 1 + Math.max(1, attack.multishotCount) : 1;

    // STRICT CONSTRAINT: Fired shots cannot exceed the number of actual targets in range needing damage.
    // 1 target in range -> 1 shot. 2 targets in range -> at most 2 shots, etc.
    const shotsToFire = Math.min(maxCapacity, needyEnemies.length);

    // Rotate tower gun towards the primary target
    towerTrans.rotation = Math.atan2(primaryTarget.trans.y - towerTrans.y, primaryTarget.trans.x - towerTrans.x);

    // Spawn 1 projectile for each distinct target in range
    for (let i = 0; i < shotsToFire; i++) {
      const target = needyEnemies[i];
      this._spawnProjectile(world, towerId, towerTrans, target.id, target.trans, finalDamage, isCrit, attack.distanceBonus);
    }

    // Notify event bus for sound and feedback
    world.eventBus.emit('PROJECTILE_FIRED', {
      sourceId: towerId,
      targetId: primaryTarget.id,
      isCrit,
      shotsCount: shotsToFire
    });
  }

  _spawnProjectile(world, towerId, towerTrans, targetId, targetTrans, damage, isCrit, distanceBonus = 0) {
    const projId = world.createEntity();
    const dx = targetTrans.x - towerTrans.x;
    const dy = targetTrans.y - towerTrans.y;
    const dist = Math.hypot(dx, dy) || 1;
    const speed = GameConfig.projectile.speed;

    const vx = (dx / dist) * speed;
    const vy = (dy / dist) * speed;
    const angle = Math.atan2(dy, dx);

    world.addComponent(projId, new TransformComponent(towerTrans.x, towerTrans.y, angle));
    world.addComponent(projId, new VelocityComponent(vx, vy, speed, speed));
    world.addComponent(projId, new ProjectileComponent(
      towerId,
      targetId,
      0,
      GameConfig.projectile.maxLifetime,
      damage,
      isCrit,
      false, // player projectile
      towerTrans.x,
      towerTrans.y,
      distanceBonus
    ));
    world.addComponent(projId, new CircleColliderComponent(GameConfig.projectile.radius, 0.1, false));
    world.addComponent(projId, new RenderComponent(
      'projectile',
      0,
      GameConfig.projectile.radius,
      isCrit ? GameConfig.colors.critText : GameConfig.colors.projectile,
      isCrit ? '#ffe600' : '#00f3ff',
      isCrit ? 16 : 10
    ));
  }
}

/**
 * CollisionSystem.js
 * Detects physical overlaps between projectiles, enemies, and the central tower.
 * Purely detects contacts and dispatches collision events via EventBus.
 */

class CollisionSystem {
  update(world, deltaTime) {
    const towers = world.getEntitiesWith(TowerComponent, TransformComponent, CircleColliderComponent);
    const hasTower = towers.length > 0;
    const towerId = hasTower ? towers[0] : null;
    const towerTrans = hasTower ? world.getComponent(towerId, TransformComponent) : null;
    const towerCol = hasTower ? world.getComponent(towerId, CircleColliderComponent) : null;

    const projectiles = world.getEntitiesWith(ProjectileComponent, TransformComponent, CircleColliderComponent);
    const enemies = world.getEntitiesWith(EnemyComponent, TransformComponent, CircleColliderComponent, HealthComponent);

    // 1. Process projectiles
    for (const projId of projectiles) {
      const proj = world.getComponent(projId, ProjectileComponent);
      const projTrans = world.getComponent(projId, TransformComponent);
      const projCol = world.getComponent(projId, CircleColliderComponent);

      proj.lifetime += deltaTime;

      // Check max lifetime expiration
      if (proj.lifetime >= proj.maxLifetime) {
        world.destroyEntity(projId);
        continue;
      }

      if (!proj.isEnemy) {
        // Player projectile hitting enemies
        let hit = false;
        for (const enemyId of enemies) {
          const enemyHealth = world.getComponent(enemyId, HealthComponent);
          if (enemyHealth.current <= 0) continue;

          const enemyTrans = world.getComponent(enemyId, TransformComponent);
          const enemyCol = world.getComponent(enemyId, CircleColliderComponent);

          const dist = Math.hypot(enemyTrans.x - projTrans.x, enemyTrans.y - projTrans.y);
          if (dist <= projCol.radius + enemyCol.radius) {
            // Distance damage scaling: damage increases slightly per unit traveled from origin
            const traveledDist = Math.hypot(projTrans.x - (proj.originX || projTrans.x), projTrans.y - (proj.originY || projTrans.y));
            const distMultiplier = 1 + (traveledDist * (proj.distanceBonus || 0));
            const finalDamage = Math.max(1, Math.round(proj.damage * distMultiplier));

            world.eventBus.emit('PROJECTILE_HIT', {
              projectileId: projId,
              targetId: enemyId,
              damage: finalDamage,
              isCrit: proj.isCrit,
              hitX: projTrans.x,
              hitY: projTrans.y
            });
            world.destroyEntity(projId);
            hit = true;
            break;
          }
        }
        if (hit) continue;
      } else {
        // Enemy projectile hitting the tower
        if (hasTower) {
          const dist = Math.hypot(towerTrans.x - projTrans.x, towerTrans.y - projTrans.y);
          if (dist <= projCol.radius + towerCol.radius) {
            world.eventBus.emit('TOWER_HIT', {
              projectileId: projId,
              damage: proj.damage,
              hitX: projTrans.x,
              hitY: projTrans.y
            });
            world.destroyEntity(projId);
            continue;
          }
        }
      }
    }

    // 2. Process enemy body contact with tower (periodic melee gnaw attack every 1 second)
    if (hasTower) {
      for (const enemyId of enemies) {
        const enemyHealth = world.getComponent(enemyId, HealthComponent);
        if (enemyHealth.current <= 0) continue;

        const enemyComp = world.getComponent(enemyId, EnemyComponent);
        if (!enemyComp || enemyComp.isSniper || enemyComp.type === 'boss_shield') continue; // Snipers shoot from afar, boss shields are armor

        const enemyTrans = world.getComponent(enemyId, TransformComponent);
        const enemyCol = world.getComponent(enemyId, CircleColliderComponent);

        const dist = Math.hypot(towerTrans.x - enemyTrans.x, towerTrans.y - enemyTrans.y);
        const contactDist = towerCol.radius + enemyCol.radius + 3; // 3px contact tolerance

        if (dist <= contactDist) {
          if (enemyComp.meleeCooldown > 0) {
            enemyComp.meleeCooldown -= deltaTime;
          }

          // Strike the core every 1.0s while contacting
          if (enemyComp.meleeCooldown <= 0) {
            enemyComp.meleeCooldown = enemyComp.meleeInterval || 1.0;

            world.eventBus.emit('TOWER_CONTACT', {
              enemyId,
              hitX: enemyTrans.x,
              hitY: enemyTrans.y
            });
          }
        } else {
          // Reset cooldown so next contact hits immediately
          enemyComp.meleeCooldown = 0;
        }
      }
    }
  }
}

/**
 * DamageSystem.js
 * Applies mitigation formulas (flat defense and percent armor capped at 85%),
 * updates health, executes passive regeneration, and triggers death / game over events.
 */

class DamageSystem {
  init(world) {
    // 1. Listen for player projectile hitting enemy
    world.eventBus.on('PROJECTILE_HIT', (event) => {
      this._applyDamageToEntity(world, event.targetId, event.damage, event.isCrit, event.hitX, event.hitY);
    });

    // 2. Listen for sniper projectile hitting tower
    world.eventBus.on('TOWER_HIT', (event) => {
      const towers = world.getEntitiesWith(TowerComponent);
      if (towers.length > 0) {
        this._applyDamageToEntity(world, towers[0], event.damage, false, event.hitX, event.hitY);
      }
    });

    // 3. Listen for enemy ramming tower
    world.eventBus.on('TOWER_CONTACT', (event) => {
      const towers = world.getEntitiesWith(TowerComponent);
      if (towers.length > 0) {
        // Calculate contact damage based on scaled enemy damage
        const enemyComp = world.getComponent(event.enemyId, EnemyComponent);
        const enemyType = enemyComp ? enemyComp.type : 'scout';
        const contactDamage = (enemyComp && enemyComp.damage) ? enemyComp.damage : (GameConfig.enemies[enemyType]?.baseDamage || 15);
        this._applyDamageToEntity(world, towers[0], contactDamage, false, event.hitX, event.hitY);
      }
    });
  }

  update(world, deltaTime) {
    // Passive health regeneration
    const healthEntities = world.getEntitiesWith(HealthComponent);
    for (const id of healthEntities) {
      const health = world.getComponent(id, HealthComponent);
      if (health.current > 0 && health.current < health.max && health.regenRate > 0) {
        health.current = Math.min(health.max, health.current + health.regenRate * deltaTime);
      }
    }
  }

  _applyDamageToEntity(world, targetId, rawDamage, isCrit, hitX, hitY) {
    const health = world.getComponent(targetId, HealthComponent);
    if (!health || health.current <= 0) return;

    const armor = world.getComponent(targetId, ArmorComponent);
    const isTower = world.hasComponent(targetId, TowerComponent);

    // Armor mitigation: flat subtraction followed by capped percentage reduction
    const flatRed = armor ? (armor.flatReduction || 0) : 0;
    const rawPct = armor ? (armor.percentReduction || 0) : 0;
    const cappedPct = Math.min(0.85, rawPct); // Soft cap at 85%

    const damageAfterFlat = Math.max(1, rawDamage - flatRed);
    let netDamage = Math.max(1, Math.round(damageAfterFlat * (1 - cappedPct)));

    // Aegis Dome Defense: 50% damage reduction for all enemies inside an active Aegis dome
    if (!isTower) {
      const aegises = world.getEntitiesWith(EnemyComponent, TransformComponent);
      const targetTrans = world.getComponent(targetId, TransformComponent);
      if (targetTrans) {
        let insideAegisDome = false;
        for (const aId of aegises) {
          const aComp = world.getComponent(aId, EnemyComponent);
          if (aComp && aComp.type === 'aegis') {
            const aTrans = world.getComponent(aId, TransformComponent);
            if (aTrans) {
              const domeR = aComp.shieldDomeRadius || 115;
              const d = Math.hypot(targetTrans.x - aTrans.x, targetTrans.y - aTrans.y);
              if (d <= domeR) {
                insideAegisDome = true;
                break;
              }
            }
          }
        }
        if (insideAegisDome) {
          netDamage = Math.max(1, Math.round(netDamage * 0.5));
        }
      }
    }

    health.current -= netDamage;

    // Get position for particle/text feedback
    const trans = world.getComponent(targetId, TransformComponent);
    const posX = hitX !== undefined ? hitX : (trans ? trans.x : 0);
    const posY = hitY !== undefined ? hitY : (trans ? trans.y : 0);

    world.eventBus.emit('DAMAGE_DEALT', {
      targetId,
      netDamage,
      isCrit: !!isCrit,
      isTower,
      x: posX,
      y: posY
    });

    if (isTower) {
      world.eventBus.emit('TOWER_DAMAGED', {
        currentHp: health.current,
        maxHp: health.max,
        damageTaken: netDamage
      });
    }

    // Death check
    if (health.current <= 0) {
      health.current = 0;
      const enemyComp = world.getComponent(targetId, EnemyComponent);

      world.eventBus.emit('ENTITY_DIED', {
        entityId: targetId,
        isTower,
        isEnemy: !isTower,
        enemyType: enemyComp ? enemyComp.type : null,
        baseReward: enemyComp ? enemyComp.baseReward : 0,
        x: posX,
        y: posY
      });

      // Splitter: explodes into 3 fast triangular shards at death position
      if (enemyComp && enemyComp.type === 'splitter') {
        world.eventBus.emit('SPLITTER_SPLIT', {
          x: posX,
          y: posY
        });
      }

      // Boss Architect: destroy any remaining orbiting shield segments
      if (enemyComp && enemyComp.type === 'boss_architect' && enemyComp.shieldIds) {
        for (const sId of enemyComp.shieldIds) {
          if (world.entityManager.isAlive(sId)) {
            world.destroyEntity(sId);
          }
        }
      }

      if (isTower) {
        world.isGameOver = true;
        world.isPaused = true;
        world.eventBus.emit('GAME_OVER', {
          reason: 'TOWER_DESTROYED'
        });
      } else {
        world.destroyEntity(targetId);
      }
    }
  }
}

/**
 * WaveSystem.js
 * Manages wave scheduling, onboarding pacing curves, micro-jitter speed variance,
 * 5-second intermission break countdowns, and mathematical stat scaling.
 */

class WaveSystem {
  constructor() {
    this.currentWave = 1;
    this.state = 'ACTIVE'; // Wave 1 starts immediately
    this.intermissionTimer = 0;
    this.intermissionDuration = GameConfig.waves.intermissionDuration || 5.0;

    this.spawnQueue = [];
    this.spawnInterval = 1.2;
    this.spawnTimer = 0.3; // First enemy spawns in 0.3s
    this.totalEnemiesInWave = 0;
    this.enemiesSpawned = 0;
  }

  init(world) {
    world.eventBus.on('SPLITTER_SPLIT', (event) => {
      this._spawnSplitterShards(world, event.x, event.y);
    });
  }

  startFirstWave(world) {
    this.currentWave = 1;
    this._startWave(world);
  }

  update(world, deltaTime) {
    if (world.isGameOver) return;

    if (this.state === 'INTERMISSION') {
      this.intermissionTimer -= deltaTime;

      world.eventBus.emit('INTERMISSION_TICK', {
        remaining: Math.max(0, this.intermissionTimer),
        duration: this.intermissionDuration,
        progress: Math.max(0, this.intermissionTimer) / this.intermissionDuration,
        nextWave: this.currentWave
      });

      if (this.intermissionTimer <= 0) {
        this._startWave(world);
      }
    } else if (this.state === 'ACTIVE') {
      // 1. Spawning
      this.spawnTimer -= deltaTime;
      if (this.spawnTimer <= 0 && this.spawnQueue.length > 0) {
        const nextType = this.spawnQueue.shift();
        this._spawnEnemy(world, nextType);
        this.enemiesSpawned++;
        this.spawnTimer = this.spawnInterval;

        world.eventBus.emit('WAVE_PROGRESS', {
          wave: this.currentWave,
          spawned: this.enemiesSpawned,
          total: this.totalEnemiesInWave,
          alive: world.getEntitiesWith(EnemyComponent).length
        });
      }

      // 2. Wave Completion Check
      const activeEnemies = world.getEntitiesWith(EnemyComponent);
      if (this.spawnQueue.length === 0 && activeEnemies.length === 0) {
        this._completeWave(world);
      }
    }
  }

  _startWave(world) {
    this.state = 'ACTIVE';
    this.spawnQueue = this._generateWaveEnemies(this.currentWave);
    this.totalEnemiesInWave = this.spawnQueue.length;
    this.enemiesSpawned = 0;
    this.spawnInterval = this._calculateSpawnInterval(this.currentWave);
    this.spawnTimer = 0.5; // Short delay before first spawn

    world.eventBus.emit('WAVE_STARTED', {
      wave: this.currentWave,
      totalEnemies: this.totalEnemiesInWave
    });
  }

  _completeWave(world) {
    world.eventBus.emit('WAVE_COMPLETED', {
      wave: this.currentWave
    });

    this.currentWave++;
    this.state = 'INTERMISSION';
    this.intermissionDuration = GameConfig.waves.intermissionDuration || 5.0; // 5-second break phase
    this.intermissionTimer = this.intermissionDuration;

    world.eventBus.emit('INTERMISSION_STARTED', {
      duration: this.intermissionDuration,
      nextWave: this.currentWave
    });
  }

  /**
   * Generates enemy sequence matching onboarding curve and high-wave scaling
   */
  _generateWaveEnemies(wave) {
    const list = [];

    // Boss Waves: Every 10th wave (10, 20, 30...) features the Architect Boss
    if (wave % 10 === 0) {
      list.push('boss_architect');
      return list;
    }

    if (wave === 1) {
      // Wave 1: 9 basic scouts
      for (let i = 0; i < 9; i++) list.push('scout');
    } else if (wave === 2) {
      // Wave 2: 12 scouts
      for (let i = 0; i < 12; i++) list.push('scout');
    } else if (wave === 3) {
      // Wave 3: 16 scouts
      for (let i = 0; i < 16; i++) list.push('scout');
    } else if (wave === 4) {
      // Wave 4: First Fighters (speed test) + scouts
      for (let i = 0; i < 10; i++) list.push('scout');
      for (let i = 0; i < 6; i++) list.push('fighter');
    } else if (wave === 5) {
      // Wave 5: Debut of Pentagon Aegis (exactly 1 unit) + scouts & fighters
      for (let i = 0; i < 10; i++) list.push('scout');
      for (let i = 0; i < 6; i++) list.push('fighter');
      list.push('aegis'); // Exactly 1 on Wave 5
    } else if (wave === 6) {
      // Wave 6: Debut of Fractal Splitter (1 unit) + Tanks
      for (let i = 0; i < 10; i++) list.push('scout');
      for (let i = 0; i < 5; i++) list.push('fighter');
      for (let i = 0; i < 2; i++) list.push('tank');
      list.push('aegis');
      list.push('splitter');
    } else if (wave === 7) {
      // Wave 7: Debut of Vector Blinker (1 unit)
      for (let i = 0; i < 10; i++) list.push('scout');
      for (let i = 0; i < 5; i++) list.push('fighter');
      for (let i = 0; i < 3; i++) list.push('tank');
      list.push('aegis');
      list.push('splitter');
      list.push('blinker');
    } else if (wave === 8) {
      // Wave 8: Debut of Snipers + combined roster
      for (let i = 0; i < 9; i++) list.push('scout');
      for (let i = 0; i < 5; i++) list.push('fighter');
      for (let i = 0; i < 3; i++) list.push('tank');
      for (let i = 0; i < 3; i++) list.push('sniper');
      list.push('aegis');
      list.push('splitter');
      list.push('blinker');
    } else if (wave === 9) {
      // Wave 9: Intense combined pre-boss wave
      for (let i = 0; i < 10; i++) list.push('scout');
      for (let i = 0; i < 6; i++) list.push('fighter');
      for (let i = 0; i < 3; i++) list.push('tank');
      for (let i = 0; i < 3; i++) list.push('sniper');
      list.push('aegis');
      list.push('splitter');
      list.push('blinker');
      list.push('blinker');
    } else {
      // Wave 11+: High wave scaling with calibrated special enemy counts
      const baseCount = 20 + (wave - 10) * 3;

      // Aegis: 1 on w5, 2-3 on w15, max 4
      const aegisCount = Math.min(4, Math.max(1, Math.floor(1 + (wave - 5) / 5)));
      // Splitter: rare unique unit, 1-3
      const splitterCount = Math.min(3, Math.max(1, Math.floor(1 + (wave - 6) / 6)));
      // Blinker: 2-4
      const blinkerCount = Math.min(4, Math.max(1, Math.floor(1 + (wave - 7) / 4)));

      for (let i = 0; i < aegisCount; i++) list.push('aegis');
      for (let i = 0; i < splitterCount; i++) list.push('splitter');
      for (let i = 0; i < blinkerCount; i++) list.push('blinker');

      const regularCount = Math.max(12, baseCount - aegisCount - splitterCount - blinkerCount);
      const scoutCount = Math.floor(regularCount * 0.35);
      const fighterCount = Math.floor(regularCount * 0.25);
      const tankCount = Math.floor(regularCount * 0.22);
      const sniperCount = Math.max(1, regularCount - scoutCount - fighterCount - tankCount);

      for (let i = 0; i < scoutCount; i++) list.push('scout');
      for (let i = 0; i < fighterCount; i++) list.push('fighter');
      for (let i = 0; i < tankCount; i++) list.push('tank');
      for (let i = 0; i < sniperCount; i++) list.push('sniper');
    }

    // Shuffle queue slightly so enemy types interleave smoothly
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }

    return list;
  }

  _calculateSpawnInterval(wave) {
    if (wave === 1) return 1.35; // Low density for early onboarding
    if (wave <= 3) return 1.05;
    if (wave <= 6) return 0.85;
    return Math.max(0.45, 0.80 - (wave - 6) * 0.03);
  }

  _spawnEnemy(world, type) {
    const archetype = GameConfig.enemies[type];
    if (!archetype) return;

    const enemyId = world.createEntity();
    const w = world.width || 1200;
    const h = world.height || 800;
    const centerX = w / 2;
    const centerY = h / 2;

    // Radial spawn: spawn at a uniform distance outside the visible screen corners
    // Guarantees all enemies travel identical distance to the tower core from any direction (fixes 16:9 pacing imbalance)
    const cornerDist = Math.hypot(w / 2, h / 2);
    const spawnMargin = 40;
    const spawnRadius = cornerDist + spawnMargin;

    const spawnAngle = Math.random() * Math.PI * 2;
    const spawnX = centerX + Math.cos(spawnAngle) * spawnRadius;
    const spawnY = centerY + Math.sin(spawnAngle) * spawnRadius;

    // 1. Micro-jitter speed variation (±5% to ±8%)
    const jitterMin = GameConfig.waves.speedJitterMin || -0.07;
    const jitterMax = GameConfig.waves.speedJitterMax || 0.07;
    const jitter = 1 + (jitterMin + Math.random() * (jitterMax - jitterMin));
    const finalSpeed = archetype.baseSpeed * jitter;

    // 2. Exponential stat scaling for higher waves
    // HP = BaseHP * (1.10 ^ (Wave - 1))
    // Damage = BaseDmg * (1.07 ^ (Wave - 1))
    const wave = this.currentWave;
    const hpMultiplier = Math.pow(GameConfig.waves.hpScaleFactor, wave - 1);
    const scaledHp = Math.round(archetype.baseHp * hpMultiplier);

    const dmgMultiplier = Math.pow(GameConfig.waves.damageScaleFactor, wave - 1);
    const scaledDamage = Math.max(1, Math.round(archetype.baseDamage * dmgMultiplier));

    const isSniper = archetype.type === 'sniper';

    // Sniper stop distance dynamically adapts to tower attack range
    // Ensures snipers always stop within player attack zone (e.g. 90% of range, max 240px)
    let stopDistance = archetype.stopDistance || 240;
    if (isSniper) {
      const towers = world.getEntitiesWith(TowerComponent, AttackComponent);
      const towerAttack = towers.length > 0 ? world.getComponent(towers[0], AttackComponent) : null;
      const currentTowerRange = towerAttack ? towerAttack.range : GameConfig.tower.baseRange;
      stopDistance = Math.min(archetype.stopDistance || 240, Math.floor(currentTowerRange * 0.90));
    }

    // Rotation: scout, tank, aegis, boss rotate smoothly; fighter, sniper, splitter, blinker point forward
    let rotSpeed = 0;
    if (archetype.type === 'scout') {
      rotSpeed = (Math.random() < 0.5 ? -1 : 1) * (1.2 + Math.random() * 1.6); // 1.2 to 2.8 rad/s
    } else if (archetype.type === 'tank') {
      rotSpeed = (Math.random() < 0.5 ? -1 : 1) * (0.4 + Math.random() * 0.6); // 0.4 to 1.0 rad/s
    } else if (archetype.type === 'aegis') {
      rotSpeed = (Math.random() < 0.5 ? -1 : 1) * 0.5;
    } else if (archetype.type === 'boss_architect') {
      rotSpeed = (Math.random() < 0.5 ? -1 : 1) * 0.4;
    }

    const angleToCenter = Math.atan2(centerY - spawnY, centerX - spawnX);
    const initialRotation = (archetype.type === 'scout' || archetype.type === 'tank' || archetype.type === 'aegis' || archetype.type === 'boss_architect')
      ? Math.random() * Math.PI * 2
      : angleToCenter;

    world.addComponent(enemyId, new TransformComponent(spawnX, spawnY, initialRotation));
    world.addComponent(enemyId, new VelocityComponent(0, 0, archetype.baseSpeed, finalSpeed));
    world.addComponent(enemyId, new CircleColliderComponent(archetype.radius, archetype.mass, false));
    world.addComponent(enemyId, new HealthComponent(scaledHp, scaledHp, 0));
    world.addComponent(enemyId, new ArmorComponent(0, 0));
    world.addComponent(enemyId, new RenderComponent(
      'polygon',
      archetype.sides,
      archetype.radius,
      archetype.color,
      archetype.glowColor,
      archetype.glowBlur
    ));

    const enemyComp = new EnemyComponent(
      archetype.type,
      archetype.baseReward,
      isSniper,
      isSniper ? (GameConfig.enemies.sniper.initialAimDelay || 0.45) : 0, // initial shootCooldown
      archetype.shootInterval || 2.8,
      stopDistance,
      rotSpeed,
      scaledDamage,
      1.0,
      archetype.shieldDomeRadius || 0
    );

    // If Boss Architect: spawn physical rotating shield segments
    if (archetype.type === 'boss_architect') {
      const shieldCount = wave >= 20 ? 8 : (archetype.shieldCount || 6);
      const orbitR = archetype.shieldOrbitRadius || 78;
      const orbitSpeed = archetype.shieldOrbitSpeed || 1.25;
      const shieldArchetype = GameConfig.enemies.boss_shield;
      const shieldHp = Math.round(shieldArchetype.baseHp * hpMultiplier);

      const shieldIds = [];
      for (let i = 0; i < shieldCount; i++) {
        const shieldAngle = (i / shieldCount) * Math.PI * 2;
        const sx = spawnX + Math.cos(shieldAngle) * orbitR;
        const sy = spawnY + Math.sin(shieldAngle) * orbitR;

        const sId = world.createEntity();
        world.addComponent(sId, new TransformComponent(sx, sy, shieldAngle + Math.PI / 2));
        world.addComponent(sId, new VelocityComponent(0, 0, 0, 0));
        world.addComponent(sId, new CircleColliderComponent(shieldArchetype.radius, shieldArchetype.mass, true)); // isStatic: true
        world.addComponent(sId, new HealthComponent(shieldHp, shieldHp, 0));
        world.addComponent(sId, new ArmorComponent(0, 0));
        world.addComponent(sId, new RenderComponent(
          'shield_segment',
          shieldArchetype.sides,
          shieldArchetype.radius,
          shieldArchetype.color,
          shieldArchetype.glowColor,
          shieldArchetype.glowBlur
        ));
        world.addComponent(sId, new EnemyComponent(
          'boss_shield',
          shieldArchetype.baseReward,
          false,
          0,
          0,
          0,
          0,
          shieldArchetype.baseDamage
        ));
        shieldIds.push(sId);
      }

      enemyComp.shieldCount = shieldCount;
      enemyComp.shieldIds = shieldIds;
      enemyComp.shieldOrbitRadius = orbitR;
      enemyComp.shieldOrbitSpeed = orbitSpeed;
      enemyComp.shieldOrbitAngle = 0;
    }

    world.addComponent(enemyId, enemyComp);

    world.eventBus.emit('ENEMY_SPAWNED', {
      entityId: enemyId,
      type: archetype.type,
      hp: scaledHp,
      damage: scaledDamage
    });
  }

  _spawnSplitterShards(world, x, y) {
    const archetype = GameConfig.enemies.splitter_shard;
    if (!archetype) return;

    const hpMultiplier = Math.pow(GameConfig.waves.hpScaleFactor, this.currentWave - 1);
    const scaledHp = Math.round(archetype.baseHp * hpMultiplier);
    const dmgMultiplier = Math.pow(GameConfig.waves.damageScaleFactor, this.currentWave - 1);
    const scaledDamage = Math.max(1, Math.round(archetype.baseDamage * dmgMultiplier));

    const towerX = world.width / 2;
    const towerY = world.height / 2;
    const angleToTower = Math.atan2(towerY - y, towerX - x);

    // Backward angle away from tower
    const angleAway = angleToTower + Math.PI;

    // 3 shards scatter backwards and to the sides: left-back, direct-back, right-back
    const scatterOffsets = [-0.75, 0, 0.75];
    const burstSpeed = 220;
    const scatterDuration = 0.50; // 0.5 seconds of backward/sideways scattering

    for (let i = 0; i < 3; i++) {
      const scatterAngle = angleAway + scatterOffsets[i];
      const offsetDist = 10;
      const sx = x + Math.cos(scatterAngle) * offsetDist;
      const sy = y + Math.sin(scatterAngle) * offsetDist;

      const vx = Math.cos(scatterAngle) * burstSpeed;
      const vy = Math.sin(scatterAngle) * burstSpeed;

      const shardId = world.createEntity();
      world.addComponent(shardId, new TransformComponent(sx, sy, scatterAngle));
      world.addComponent(shardId, new VelocityComponent(vx, vy, archetype.baseSpeed, archetype.baseSpeed));
      world.addComponent(shardId, new CircleColliderComponent(archetype.radius, archetype.mass, false));
      world.addComponent(shardId, new HealthComponent(scaledHp, scaledHp, 0));
      world.addComponent(shardId, new ArmorComponent(0, 0));
      world.addComponent(shardId, new RenderComponent(
        'polygon',
        archetype.sides,
        archetype.radius,
        archetype.color,
        archetype.glowColor,
        archetype.glowBlur
      ));

      const enemyComp = new EnemyComponent(
        archetype.type,
        archetype.baseReward,
        false,
        0,
        0,
        0,
        (i % 2 === 0 ? 1 : -1) * 3.5,
        scaledDamage
      );
      enemyComp.scatterTimer = scatterDuration;
      world.addComponent(shardId, enemyComp);

      world.eventBus.emit('ENEMY_SPAWNED', {
        entityId: shardId,
        type: archetype.type,
        hp: scaledHp,
        damage: scaledDamage
      });
    }

    // Keep wave counters in sync
    this.totalEnemiesInWave += 3;
    this.enemiesSpawned += 3;
  }
}
